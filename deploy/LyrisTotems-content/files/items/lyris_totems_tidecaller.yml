# LyrisTotems supporter style: Tidecaller (cosmetic; permission lyristotems.skin.tidecaller)
lyris_totem_tidecaller_1:
  itemname: '<#9ce8d0>Lighthouse · Homestead'
  material: 'PAPER'
  lore:
  - '<gray><i>The lighthouse of a homestead.</i>'
  - '<#9ce8d0>✦ Tidecaller style</#9ce8d0> <dark_gray>· a supporter reward'
  - '<dark_gray>Hearth · rank 1 of 6'
  Components:
    max_stack_size: 1
    item_model: 'lyris_totems:lyris_totem_tidecaller_1'
  Mechanics:
    furniture:
      properties:
        display_transform: NONE
      rotatable: true
      limited_placing:
        floor: true
        wall: false
        roof: false
      hitbox:
        barriers:
        - 0,0,0
      lights:
        toggleable: true
        toggled_item_model: 'lyris_totems:lyris_totem_tidecaller_1_lit'
        lights:
        - 0,1,0 15
