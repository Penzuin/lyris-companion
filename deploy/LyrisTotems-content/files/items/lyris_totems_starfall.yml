  lore:
  - '<gray><i>The star obelisk of a homestead.</i>'
  - '<#c6a8f0>✦ Starfall style</#c6a8f0> <dark_gray>· a supporter reward'
  - '<dark_gray>Hearth · rank 1 of 6'
