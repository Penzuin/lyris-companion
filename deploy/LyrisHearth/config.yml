# LyrisHearth config. Generated by hearth_data.py: edit there and re-run, or edit here and /lyrishearth reload.
# Times are seconds at normal heat (campfire, fire, lit furnace). Soul campfire cooks at 0.6x with wider
# windows; magma 1.25x; lava 1.6x with narrower windows.

tuning:
  tick-period: 10            # server ticks between vessel updates (10 = twice a second)
  add-window: 0.25           # fraction of a pot/oven cook during which you may still add ingredients
  ready-window: 30           # seconds a finished pot/oven stays perfect before it starts to catch
  catch-window: 30           # seconds of catching (one star lost) before it burns
  stir-gap: 4                # seconds between stirs that count
  skillet-window: 4          # seconds of golden per side
  board-chops: 3
  particle-range: 24         # only show particles and animate when a player is this close
  max-items: {pot: 4, oven: 4, skillet: 3, board: 3}
  shared-meal-minutes: 10
  proper-meal-minutes: 20
  field-dressing: {spider-leg-chance: 0.35, slime-jelly-chance: 0.30}
  visuals: {surface-y: [0.5625, 0.75, 0.9375], surface-scale: 0.75, surface-offset: 0.33, item-scale: 0.32,
            oven-floor-y: 0.32, skillet-y: 0.17, board-y: 0.12,
            pot-surface-y: [0.28, 0.40, 0.52], pot-surface-scale: 0.56, pot-item-radius: 0.13,
            oven-mouth-forward: 0.22, oven-mouth-y: 0.23, oven-mouth-flip: false}
  oven-fuel-cap: 900          # seconds of fire a clay oven can hold (coal 120, log 60, planks 30, blaze rod 180, coal block 900)

items:
  pot: hearth_pot
  oven: hearth_oven
  ladle: hearth_ladle
  spatula: hearth_spatula
  cleaver: hearth_cleaver
  spoon: utensil_spoon
  knife: utensil_knife
  skillet: hearth_skillet
  board: hearth_board
  spider-leg: spider_leg
  slime-jelly: slime_jelly
  oil: cooking_oil
  butter: butter
  hodgepodge: cook_mystery_hash
  burnt: cook_charred_mess

# LyrisAngling fish ids (any quality counts): what "fish" means in a recipe
fish: [fish_harbour_sardine, fish_silverline_herring, fish_tidecod, fish_moon_anchovy, fish_saltscale_bream, fish_reef_lanternfish, fish_kelp_pike, fish_storm_eel, fish_mistcarp, fish_willow_perch, fish_brookshine_trout, fish_river_bellfish, fish_lamp_eel, fish_ferrystone_catfish, fish_starscale_salmon, fish_roundmere_pike, fish_mosswhisker_chub, fish_dusk_bass, fish_glassfin_minnow, fish_lilyback_sunfish, fish_mire_perch, fish_bogwhistle_eel, fish_peatfang_gar, fish_fen_toadfish, fish_snowtrout, fish_glacier_char, fish_icebell_smelt, fish_frostgill_pike, fish_blind_gloamfish, fish_stonegill, fish_cinder_chub, fish_ghost_lanternfish, fish_syrena_pearlfin, fish_mist_lord, fish_roundmere_king, fish_glacierheart, fish_deep_lantern]

skillet-simple:
