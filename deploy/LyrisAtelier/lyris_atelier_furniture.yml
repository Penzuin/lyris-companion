# Polwhele's workroom furniture (LyrisAtelier 2.1). Each piece is a dressmaking station: right-click opens its step.
# Models: atelier/art/furniture.py (front faces south, 2-wide pieces extend to +x). Pack: lyris_atelier.zip.
atelier_order_desk:
  itemname: '<#e8b4bc>Order Desk'
  material: PAPER
  lore:
  - '<gray><i>The Order Book, a quill, and the bell</i>'
  - '<gray><i>that calls the next client in.</i>'
  - ''
  - '<#e48797>Dressmaking · the workroom guide'
  Components:
    item_model: 'lyris_atelier:furniture/atelier_order_desk'
  Mechanics:
    furniture:
      properties:
        display_transform: NONE
      rotatable: false
      hitbox:
        barriers:
        - 0,0,0
