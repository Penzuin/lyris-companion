board for better finds."], "source": "claude/Lyris panning and sifting build v1.md"}, {"id": "inventors", "category": "deep", "name": "The Inventors' Guild", "tagline": "It worked once. It will work again.", "status": "live", "summary": "The Aurenn left machines everywhere. Find crusted and sea-worn relics in ruins, wrecks, while digging, deep mining or fishing. Restore them into brass cogs, mainsprings, lenses and cores, machine those on contraptions you build yourself, and assemble gadgets at the Tinker's Bench. Gadgets include the Tide Clock, the Aurenn Compass that points to ancient sites, a Brass Grapnel, and placeable Music Boxes, Weather Vanes, Diving Bells and Gear Lifts.", "steps": ["Find relics in ruins, shipwrecks, deep mines or on your fishing line.", "Brush them at the Restoration Table to uncover parts. Fewer strokes means more parts.", "Build an Aurenn Lathe and Spring Winder, then crank parts into Calibrated Cogs and Coiled Springs.", "Collect 3 Schematic Shards to unlock a new schematic.", "Assemble at the Tinker's Bench by solving the gear-train puzzle."], "commands": ["/guild - your guild rank and known schematics"], "tips": ["A fine build (fewest gears) holds 25% more charges.", "Recharge gadgets at the Spring Winder.", "A Diving Bell placed underwater keeps everyone under it breathing."], "source": "claude/Lyris inventors guild reference.md"}, {"id": "archaeology", "category": "deep", "name": "Archaeology", "tagline": "Dig the trench, read the layers, record before you lift.", "status": "live", "summary": "Dig sites appear in the world around you: field scatters, barrows, cave shelters, wrecks and Aurenn ruins. Open a trench and dig top-down through six layers of Lyris history, from today's topsoil to the Starfall Glass. Pick your tool carefully, since a spade is fast but cracks finds and a brush is gentle. Record which layer each find came from before you lift it. Then clean, mend, soak and polish them at the Conservation Bench. The Lyris Museum and player museums are planned next.", "steps": ["Craft a spade, trowel, brush and sieve. A Surveyor's Rod helps you hear sites nearby.", "Right-click a dig site block to open its trench. Barrows and ruins need Survey Stakes first.", "Dig down cell by cell. A find's edge shows once the cell next to it is open.", "Click an exposed find and choose the layer it lay in, then lift it.", "Conserve it at the Conservation Bench to make it Conserved."], "commands": ["/dig - your Field Notebook", "/dig invite <player> - bring a friend onto your staked dig", "/dig help - how digging works"], "tips": ["You get 24 dig actions per site per day, so spend them well.", "Lifting without recording costs Note. Patience pays.", "Lost items from past seasons can turn up again as Weathered finds.", "Practise at the Harbour Dig under Lantern Pier."], "source": "claude/Lyris archaeology LyrisDig build reference.md"}, {"id": "provenance", "category": "deep", "name": "Provenance", "tagline": "Your gear remembers who made it and where it has been.", "status": "live", "summary": "Lyris quietly keeps a history for notable items. Crafted gear records who made it and where, signed books record their author, and every change of hands is noted. Places are named by claim or biome, never by coordinates. The very first of each kind ever made gets a special mark. Most items look unchanged until their story grows, then a line appears saying the item holds a note. One day these histories will turn your best pieces into museum artifacts.", "steps": ["Craft gear or sign a book as usual. The history starts by itself.", "Pass items to friends and the history records each new owner.", "Keep an item long enough and its note grows."], "commands": ["/provenance - learn who keeps the history"], "tips": ["If you're the first in Lyris to make something, you'll get a message, and the item will remember.", "Artifact status never adds stats. It's about the story."], "source": "claude/Lyris provenance LyrisProvenance reference.md"}, {"id": "ciphers", "category": "deep", "name": "Cipher hunts", "tagline": "Decode Lyrin runes and dig up what they point to.", "status": "live", "summary": "Messages written in Lyrin, the elven moon-script of Lyris, are hidden on stones, signs, tavern tables and in bottles from the sea. Right-click one to copy it into your Cipher Book, gather the five Rune Key pages from the lecterns in the Observatory library, and decode it letter by letter. Harder hunts add a shift or a keyword. Each answer is a direction in the world's own words, leading to a cache you can dig up once.", "steps": ["Right-click a rune message to copy it into your Cipher Book.", "Visit the Observatory library lecterns to learn the five Rune Key pages.", "In the book, click each unknown rune to guess its letter. Every copy of that rune changes together.", "For shifted runes use the SHIFT dial, and for keyed runes enter a keyword.", "Press CHECK. A solved page is sealed in gold wax. Then go find the cache."], "commands": ["/cipher - open your Cipher Book", "/cipher key <word> - try a keyword on the open message"], "tips": ["Lyrin has logic: a rune's stem and marks hint at its sound, so you can guess unknown runes.", "Look for hints near shifted messages, like 'the tide moves three'.", "Every cache pays each player once, so friends can solve the same hunt.", "Decode 25 messages for the Runereader title."], "source": "claude/Lyris cipher hunts reference.md"}, {"id": "hollowdeep", "category": "deep", "name": "The Hollowdeep", "tagline": "Six strata of Aurenn ruins, and a Heart at the bottom.", "status": "in progress", "summary": "Beyond the Delvers' Gate lies the Hollowdeep, a dungeon built fresh for every run. Parties of up to four descend through the Drowned Halls, Clockwork Vaults, Rootworks, Ember Forges, the Mistlands Below and the Starwound, solving bells, gears, mirrors and rune seals, fighting each stratum's boss and banking loot at Waystones. Your own gear is never lost, but your Satchel of finds is at risk. At the very bottom waits the Heart of the Hollow Star.", "steps": ["Form a party of up to four at the Delvers' Board.", "Meet the Delver's Oath for your stratum. The first needs a lantern.", "Ride the lift down, clear rooms, gather sigil shards and beat the boss.", "At the Waystone, bank your Satchel and either ascend or go deeper.", "Bank your Writings to fill the Delver's Codex."], "commands": ["/delve party invite <player> - invite to your party (also accept, leave, kick, list)", "/delve start <stratum> - begin a run", "/delve answer <word> - speak a rune seal's word", "/delve ping - signal your party (handy on Silent tides)", "/delve tide - this week's Star Tide", "/delve profile - your delver record", "/delve boards - the leaderboards", "/satchel - your loot bag", "/codex - the Delver's Codex"], "tips": ["Each week's Star Tide changes the rules: dark, flooded, swarming, silent and more.", "Torches don't count as a lantern down there. Bring a real one.", "Lifts charge a toll, refunded if the start fails.", "Clearing a stratum lets you try harder Echo runs of it."], "source": "claude/Lyris LyrisDelve reference.md"}, {"id": "hunting", "category": "land", "name": "Hunting", "tagline": "Read the tracks, come in downwind, take it clean.", "status": "planned", "summary": "Custom wildlife will roam the Wilds by biome and season: rabbits, pheasants, red deer, wild boar that charge when cornered, elk, marsh ducks and foxes. You'll find them by their tracks, droppings and rubbed bark, creep in under a noise meter with the wind in your face, and take them with a clean bow shot or a trap. Meat and hides feed cooking, crafting and the apothecary, and three legendary beasts will be hinted at in Tavern rumours.", "steps": ["Find animal sign within about 10 blocks: tracks, droppings, rooted earth.", "Crouch on a track to read the animal, its age and direction.", "Approach from downwind, without sprinting or jumping.", "Take a clean head or heart shot for 3-star quality, or set traps.", "Dress it with a Skinning Knife."], "commands": [], "tips": ["Overhunted areas thin out, so check the Lodge's area board and spread out.", "The Pale Stag is never huntable.", "Dusk and dawn are the best hunting hours."], "source": "claude/Lyris hunting reference.md"}, {"id": "crops", "category": "land", "name": "Crops, herbs and seasons", "tagline": "Grow through four seasons, and chase the golden star.", "status": "live", "summary": "Farming in Lyris follows the seasons, each lasting 28 days, and harvests come in normal, silver-star and golden-star quality. Alongside familiar crops you can grow arcane ones like Moonberry, Emberroot, Glowcap, Frostpetal, Sunwheat and Voidthorn, plus the apothecary herbs Mint, Ginger, Yarrow and Chamomile. Better stars sell for more and make better dishes, brews and reagents. Wild flowers can be punched to pick them up, and the florist turns them into bouquets.", "steps": ["Plant seeds and keep them watered.", "Harvest when ripe. Many crops give seeds back.", "Sell at the Farmer's Stall, or use your harvest in cooking, brewing and alchemy."], "commands": [], "tips": ["Silver-star crops sell for 1.5x and golden-star crops for 2.5x at the Farmer's Stall.", "The Farmer's Stall pays up to 200 copper per player per day.", "The Wheel of Lyris and the Green Hearth faith are good sources of herb seeds."], "source": "claude/Lyris apothecary reference.md"}, {"id": "trees", "category": "land", "name": "Lyris trees and the Goblet Tree", "tagline": "Wisteria, mistwillows, rootwoods, and a tree that holds a pool.", "status": "live", "summary": "New land in Lyris grows its own trees: gnarled Hearthoaks, silver Moonbirches, cascading Wisteria, weeping Mistwillows in the swamps, moss-hung Mistveil Pines and Elder Rootwoods raised on cages of roots. Vanilla saplings grow a little more Lyris too. In the jungles stands the Goblet Tree, a tall trunk holding a cup of real water that changes with the seasons. Very rarely you may find a Wayroot stump or elder, old root-roads said to carry travellers to another of their kind.", "steps": ["Explore newly generated land to find the Lyris species.", "In spring, pick the Goblet Fruit bobbing in a Goblet Tree's cup.", "Eat the fruit for a chance at a Goblet Seed.", "Plant the seed on soil with lots of water and open sky nearby and give it room."], "commands": ["/goblet info - the season, the nearest Goblet Tree and your sapling's progress", "/wayroot here - check if you're standing in a Wayroot"], "tips": ["A Goblet sapling needs about 40 minutes of good conditions. Two bad checks and it withers.", "In winter the Goblet Tree grows icicles and drips like rain under the cup.", "In summer it spills over in the mornings, and in rain it pours.", "Only fresh chunks get the new trees, so head for the edge of the map."], "source": "claude/Lyris trees reference.md"}, {"id": "coins", "category": "town", "name": "Coins, wallet and the bank", "tagline": "Real coins in your purse, safe coins in the vault.", "status": "live", "summary": "Lyris runs on physical coins: Copper Pennies, Silver Marks (10c), Gold Crowns (100c) and Platinum Sovereigns (1000c). One copper buys a loaf of bread. Earnings go to your personal wallet first, which takes no inventory space and holds up to 300c. The Moonharbor Bank keeps coins safe on death, and you can buy vault upgrades to store more. Sell goods at the Moonmarket stalls: the Farmer's Stall, the General Merchant and the Fishmonger.", "steps": ["Earn coins from stalls, jobs, deliveries and trades.", "Check your purse with /wallet.", "Visit the Banker's Counter to deposit coins and upgrade your vault.", "Pay with your wallet, pack coins or bank. Spending takes from them in that order."], "commands": ["/wallet - open your wallet (also /coins, /balance, /bal, /money, /purse)", "/coins info - a quick text summary"], "tips": ["If you die, you drop 25% of your wallet and pack coins. Banked coins are never lost.", "Coins can't be stored in chests or other containers. The bank is the safe place.", "Stalls have daily caps, so it pays to have more than one trade.", "Click a coin stack in your inventory at the bank to deposit it."], "source": "claude/Lyris bank and wallet reference.md"}, {"id": "shops", "category": "town", "name": "Player shops", "tagline": "Run your own shop on Merchant Row, even while you're offline.", "summary": "Players can open their own shops: a Pedlar's pitch on Market Square, a shopfront on Merchant Row, or a shop in their own town. One shared stockroom feeds every shelf, real items show on the shelves, and customers browse a clean menu with a basket and checkout. Earnings wait in your till until you Collect. Climb from Pedlar to Guild Merchant for bigger fronts, more listings, buy orders and an apprentice behind the counter.", "steps": ["Rent a Pedlar's pitch or open a shop in a town that allows it.", "Open the Shop Ledger and shift-click items into your stockroom.", "Set a price once per item type. A suggested price is shown.", "Customers click your shelves to buy, even when you're offline.", "Tap Collect to move the till into your wallet."], "commands": ["/shop - open your Shop Ledger", "/shops - the Shop Directory: find who sells what"], "tips": ["Link a chest, barrel or cargo crate so the shop sells straight from it.", "Rent is weekly. Miss two weeks and the shop closes until it's paid.", "Prices have a floor and a ceiling per item to keep trade fair."], "source": "claude/Lyris shopkeeper reference.md"}, {"id": "lands", "category": "town", "name": "Land claims", "tagline": "Claim your corner of Lyris and build in peace.", "status": "live", "summary": "Protect your home by claiming land with Lands. Inside your claim only you and the people you trust can build, and towns can grow into nations. The Lands menus are dressed as real objects: a war-table map for the hub, walnut cabinets, notice boards with hanging tools, an ink-wash claim map, and little desk scenes with a piggy bank and a sleepy cat for prices and timers. Claims also matter elsewhere, since claim names replace coordinates across the server.", "steps": ["Find your spot and open the Lands menu.", "Claim the chunk you're standing in and name your land.", "Invite friends and set their roles and flags.", "Use the claim map to see your land (violet), trusted land (blue) and others' (red)."], "commands": ["/lands - open the Lands menu"], "tips": ["No mist creatures spawn near claims.", "Walking into a claim shows its name, a handy way to know where you are.", "Hover over objects in the menus to see what they do."], "source": "claude/Lyris lands menu reference.md"}, {"id": "ranks", "category": "town", "name": "Ranks and perks", "tagline": "Your badge in chat, your homes, your little comforts.", "status": "live", "summary": "Everyone starts as a Wanderer, with the basics: spawn, three homes, teleport requests, back, mail, warps and messages. Supporter ranks (Firefly, Moonpetal, Starweaver and Celestial) add cosmetic comforts like more homes, coloured nicknames, a portable workbench and hats. Boosters and Creators have their own badges, and staff ranks are Helper, Builder, Moderator, Admin and Owner. Each rank shows as a little badge in chat and on your nametag.", "steps": ["Join as a Wanderer and set your first home.", "Look for rank badges in chat and on nametags.", "Accept the server resource pack so badges and menus show properly."], "commands": [], "tips": ["Wanderers get 3 homes, and Celestials get 8.", "Stuck or have a question? Use /helpop to reach staff.", "With the pack on, the pause menu wears the LYRIS title and its button reads Back to Lyris."], "source": "claude/Lyris ranks reference.md"}, {"id": "moonlore", "category": "town", "name": "Moonlore, the card game", "tagline": "Collect the cards, build a deck, duel the owl or your friends.", "summary": "Moonlore is Lyris's own card game. Four factions, each with its own style: Tide draws and bounces, Grove heals and buffs, Ember burns and strikes fast, Moon wards and lulls. You collect cards in a Card Binder from boosters and a free starter deck, build a 20-card deck, and duel on a playmat with 5 lanes, 20 health and moonlight that grows each turn. Practise against the owl or challenge anyone online.", "steps": ["Open the menu and claim your free Starter Deck.", "Buy Booster Packs and open them to fill your binder.", "Build your deck in the Deck Box, or use Auto-build.", "Start a Practice Duel or Challenge a Player.", "Click a card to play it, click a glowing companion and then a target to attack, and End Turn."], "commands": ["/moonlore - open the main menu (also /cards, /ml)", "/moonlore binder - your Card Binder", "/moonlore duel <player> - challenge someone", "/moonlore accept - accept a challenge (or decline)", "/moonlore buy <n> - buy booster packs", "/moonlore stats - your record"], "tips": ["Your first win each day earns a free booster.", "Take cards out of the binder to trade them, and right-click a card to file it back.", "Legendary pulls are announced to the whole server.", "Leaving the server mid-duel counts as conceding."], "source": "claude/Lyris Moonlore card game reference.md"}, {"id": "detective", "category": "town", "name": "Detectives and the Constabulary", "tagline": "Every crime leaves a scene. Read it before it fades.", "status": "planned", "summary": "When a real crime happens, such as a kill in the wilds or a theft from an unclaimed chest, it leaves a scene that fades in about an hour. Detectives will read it with a Magnifying Glass for footprints, partial fingerprints, wounds and lantern soot, then work out the suspect on a deduction board at the Constabulary. Evidence never names anyone outright: you do the deducing. The Constabulary will also post daily NPC cases, so there's always a mystery to work.", "steps": ["Become a Constable at the Constabulary.", "Take a case from the Case Board.", "Find and bag evidence at the scene with the Magnifying Glass.", "Test evidence against suspects on the deduction board.", "Accuse with at least three pieces of evidence of two different kinds."], "commands": [], "tips": ["In the dark you need real light to see evidence, so bring your lantern.", "Rain washes evidence away faster.", "A wrong accusation pays the filing fee to the person you blamed."], "source": "claude/Lyris detective reference.md"}, {"id": "gates", "category": "town", "name": "Portcullis and drawbridge", "tagline": "Working castle gates for your stronghold.", "status": "planned", "summary": "Castle builders can look forward to a working portcullis that rises into the wall and a drawbridge that swings down on chains, both in dark elven ebony and blacksilver. A Gate Winch raises or lowers every gate within 16 blocks. A portcullis and a drawbridge can share one gateway. These are built but waiting on recipes before they come to players.", "steps": ["Build a clear gateway 3 wide and 4 tall.", "Right-click the bottom-middle block with a Portcullis, looking out.", "For a drawbridge, right-click the outer floor block with 4 blocks of open space in front.", "Place a Gate Winch nearby and right-click it to raise or lower your gates."], "commands": ["/gates info - details on the nearest gate", "/gates remove - take back a gate you built"], "tips": ["Drawbridges can swing down over water."], "source": "claude/Lyris gates LyrisGates reference.md"}, {"id": "stargazing", "category": "sky", "name": "Stargazing and the Threading Ring", "tagline": "The Lyris constellations wheel overhead. Learn them by eye.", "status": "live", "summary": "The night sky over Lyris is its own: 22 named constellations plus 3 uncharted ones, drawn in the real sky and rising and setting with the hour and the season. The mist hugs the ground but never covers the stars. Chart a constellation and the Threading Ring lets you thread its lines across the sky, with names when you look at it. Step away from town lamps and fainter stars fill in, and a spyglass shows even more.", "steps": ["Go outside on a clear night under open sky and look up.", "Chart your first constellation and Hoarfeather hands you a free Threading Ring.", "Right-click the ring to turn star lines on or off.", "Sneak and right-click to cycle modes: lines, lines and names, and later the Moonroad.", "Look through a spyglass to see fainter stars and read their names."], "commands": ["/sky - your Star Atlas, Moon Journal and stargazing rank", "/skylines - toggle or change star line mode (needs a Threading Ring)"], "tips": ["Only constellations you've charted get lines, so the ring never gives answers away.", "Town lamps hide the faint stars. Walk out into the dark for the full sky.", "Some constellations only show on new-moon nights or after special discoveries.", "The sky reacts to the server: some stars brighten as great deeds are done."], "source": "claude/Lyris LyrisSkyDome reference.md"}, {"id": "navigation-astrology", "category": "sky", "name": "Star navigation and astrology", "tagline": "Take a sight, find a Starmark, read what's coming.", "status": "in progress", "summary": "Stargazing branches into two paths. Navigators take sights with a cross-staff, astrolabe or sextant to measure how high the Lantern stands, time star transits for east and west, and plot fixes on sea charts. That opens Starmarks, hidden places that only reveal themselves when you take a sight right on the spot. Astrologers watch the moon and the four wanderers along the Moonroad and cast charts that foretell real weather, fish runs and falling stars.", "steps": ["Reach Skywatcher rank by charting constellations and recording the moon's phases.", "Choose the Navigator or Astrologer path.", "Navigators: take sights at twilight when the horizon is clear, and log fixes on a sea chart.", "Astrologers: record the moon and wanderers, then cast charts at the Astrologer's Table."], "commands": [], "tips": ["Twilight is the navigator's hour. Deep night mist hides the horizon.", "Special moons follow hidden rules. Keep a careful Moon Journal and you may crack them.", "Readings only ever foretell what the world will really do."], "source": "claude/Lyris stargazing reference.md"}, {"id": "wayfinding", "category": "sky", "name": "Finding your way", "tagline": "No coordinates here. The stars and the Hung Star bring you home.", "status": "live", "summary": "Lyris hides coordinates, so knowing where you are is a real skill. Look up: the Lantern is the pole star and always marks north, and the Watcher Owl's two eyes point to it. The Wayfarer's belt of three stars rises due east and sets due west. Far from home, a low sigil of stars that never turns with the sky sits on the bearing to Moonharbor: Syrena's Hung Star. You can't get truly stranded, since homes, spawn, carriages and lit roads always remain.", "steps": ["On a clear night, find the Lantern to know which way is north.", "Far from town, look low for the Hung Star's fixed sigil and follow it home.", "Use a spyglass on it to read its name and your distance home.", "Use claim names, lit roads and vanilla maps to fill in the rest."], "commands": [], "tips": ["The Hung Star appears once you're more than about 180 blocks from it.", "Walking into a claim shows its name on screen.", "Vanilla maps still work on land you've explored."], "source": "claude/Lyris Hung Star reference.md"}, {"id": "faiths", "category": "sky", "name": "Faiths", "tagline": "Eleven faiths, each with its own rites, vows and holy days.", "status": "in progress", "summary": "Faith in Lyris is optional and personal. Eleven faiths keep holy places around the world: the Lantern Covenant, Moonwake, the Veiled, Tide Mother, Green Hearth, the Old Hunt, the Deepkin Creed, the Wayfarers, the Bright Cask, the Ashen Ledger and the forbidden Hollow Star. Each has its own worship minigame and signature rite, from hanging a vow-lantern on the Lamp Tree to anonymous gift tides at dawn. Devotion grows from your acts and brings small blessings.", "steps": ["Visit a faith's holy place.", "Crouch there for 5 seconds to begin the Rite of Joining.", "Worship and perform your faith's rite to raise your devotion.", "Keep your vows, avoid your faith's taboos and watch for holy days."], "commands": ["/faith - open your altar or see your status (also /religion)", "/faith info <faith> - learn about a faith", "/faith codex - the Hall of Faiths", "/faith vows - your vows", "/faith leave - leave your faith", "/fc <message> - faith chat"], "tips": ["You can follow only one faith at a time, and leaving has a cost.", "Some faiths only accept joiners at night, or in hidden places.", "Rival faiths have a small edge against each other outside Moonharbor."], "source": "claude/Lyris faiths LyrisFaith 1.0 reference.md"}]}, "bestiary": [{"id": "rabbit", "name": "Lyris Rabbit", "kind": "wildlife", "habitat": "Meadows, plains, forest edges", "temperament": "Skittish", "summary": "Not the vanilla rabbit. A nervous little grazer that zig-zags when chased and dives into burrows. Most common in spring. Hunters take it with snares or a quick bow shot, and it is a favourite prey of the Lyris fox.", "facts": ["Found all year, most in spring", "Drops rabbit meat and a soft pelt", "A rare lucky foot can drop", "Snares work best"], "status": "designed"}, {"id": "pheasant", "name": "Pheasant", "kind": "wildlife", "habitat": "Fields, birch forest", "temperament": "Flighty", "summary": "An autumn bird of the open fields. When startled it bursts into the air, so the real test is hitting it in flight. Its long tail feathers are prized for fletching and hat trims.", "facts": ["Autumn only", "Flushes when startled", "Drops pheasant meat and tail feathers"], "status": "designed"}, {"id": "red_deer", "name": "Red Deer", "kind": "wildlife", "habitat": "Forests, taiga", "temperament": "Wary, bolts at noise", "summary": "Grazes in small herds of three to five and bolts at sprinting or loud movement. Approach from downwind and stay quiet. Stags carry antlers, and the rut comes in autumn.", "facts": ["Herds of 3 to 5", "Rut in autumn", "Venison, deer hide, antlers (stags only)", "Wind carries your scent"], "status": "designed"}, {"id": "wild_boar", "name": "Wild Boar", "kind": "wildlife", "habitat": "Dark forest, old growth, swamps", "temperament": "Charges if cornered or hurt", "summary": "Roots through the undergrowth for food and leaves churned earth behind. A boar that is hit but not dropped will charge, so make the first shot count or use a pit trap.", "facts": ["Found all year", "Charges when wounded", "Boar meat, thick hide, tusks", "Pit traps work"], "status": "designed"}, {"id": "elk", "name": "Elk", "kind": "wildlife", "habitat": "Snowy taiga, mountains", "temperament": "Big, slow, very wary", "summary": "A winter giant of the cold uplands. The herd posts a sentinel that watches while the others feed, so getting close takes patience and a careful line of approach.", "facts": ["Winter", "Herd keeps a sentinel", "Elk meat, heavy hide, great antlers"], "status": "designed"}, {"id": "marsh_duck", "name": "Marsh Duck", "kind": "wildlife", "habitat": "Rivers, swamps", "temperament": "Flocks, takes off together", "summary": "Floats in groups on rivers and swamps during the spring and autumn migrations. The whole flock lifts off at once when spooked. Duck decoys help draw them in.", "facts": ["Spring and autumn migrations", "Duck meat and down", "Down for bedding and warm cloaks"], "status": "designed"}, {"id": "fox", "name": "Lyris Fox", "kind": "wildlife", "habitat": "Forests", "temperament": "Cunning hunter", "summary": "Hunts rabbits through the forest and grows a white coat in winter. Best taken with a snare rather than a bow.", "facts": ["Winter-white coat in winter", "Red or white fur", "A trap animal"], "status": "designed"}, {"id": "carapotl", "name": "Carapotl (tide-lamb)", "kind": "wildlife", "habitat": "Warm reefs and black-sand beaches of the West and East Volcanoes", "temperament": "Shy, solitary, passive", "summary": "Half turtle, half axolotl. It has a soft smiling body, feathery gills and a low shell over its back. When scared it tucks its head under the shell lip and drops to the seabed. On full and new moons, females lay eggs on the beach, and the next super tide carries them out to sea.", "facts": ["Moonharbor calls them tide-lambs", "Five colours, including the rare Pearl", "Eggs on a beach mean a super tide is coming", "Never hunted; shed scutes wash ashore", "Harming one is bad luck at sea"], "status": "designed"}, {"id": "cinderhorn", "name": "Cinderhorn", "kind": "wildlife", "habitat": "Cliffs and peaks of the West Volcano", "temperament": "Shy herd animal, sure-footed", "summary": "An ash-grey cliff deer with an ibex's body and three-toed hooves that grip narrow ledges. Herds stay small, five or six at most. In the rut, males grow a branching red antler crown. A brighter crown means the buck has found the best emberberries.", "facts": ["Males cinderbucks, females ashdoes, young soot-kids", "Crowned bucks avoid steep edges", "Shed crowns give red dye and charms", "Brush them for ash fleece", "Lured by emberberries"], "status": "designed"}, {"id": "bergmaw", "name": "Bergmaw", "kind": "wildlife", "habitat": "Polar and cold seas, always at the surface", "temperament": "Passive until touched, deadly to swimmers", "summary": "From a boat it looks like a small iceberg. Below the ice it is a turtle shell over a glowing violet jellyfish bell, with kelp-like stinging tendrils trailing beneath. It lures fish and swimmers into its tendrils and drags them up to its beak. It is endangered, and few are ever born.", "facts": ["Safe from the surface unless you climb it", "Stings, shocks and grabs swimmers", "Weak point is the bell, from below", "One per large cold-ocean region at most", "Arrows from above hit only ice"], "status": "designed"}, {"id": "old_tusk", "name": "Old Tusk", "kind": "legendary", "habitat": "Dark forests, after rain", "temperament": "Aggressive", "summary": "A huge, scarred boar that is rumoured in tavern talk and the Crier. It leaves its own unique tracks. Only one exists on the server at a time, and it returns a few days after being taken.", "facts": ["Hinted by tavern rumours", "Trophy tusks", "Title: Bane of Boars"], "status": "designed"}, {"id": "ashen_elk", "name": "The Ashen Elk", "kind": "legendary", "habitat": "Near the Ember-side mountains, in winter", "temperament": "Wary", "summary": "A grey elk with charred antlers, seen only in winter near the Ember-side mountains. Its antlers are an alchemy reagent and a prized trophy.", "facts": ["Winter only", "Ashen antlers for alchemy", "One at a time on the server"], "status": "designed"}, {"id": "thornback", "name": "Thornback", "kind": "legendary", "habitat": "Wherever hunters set many traps", "temperament": "Thief", "summary": "A clever fox that raids hunters' traps. It turns up where someone has set a lot of snares. Catch it and its brush becomes a cosmetic tail charm.", "facts": ["Drawn by heavy trapping", "Thornback's brush cosmetic", "Trophy mount"], "status": "designed"}, {"id": "old_gnash", "name": "Old Gnash", "kind": "legendary", "habitat": "The bay off Moonharbor", "temperament": "Sleeping guardian", "summary": "A sea turtle the size of a chapel that guards Moonharbor's bay. Syrena struck the bargain long ago: a barrel of salt herring every New Year, now celebrated as Gnash Day. Sailors sing a shanty about feeding him.", "facts": ["Fed on Gnash Day", "Sleeps on the sea floor off town", "Part of Syrena's lore"], "status": "live"}, {"id": "pale_stag", "name": "Pale Stag", "kind": "mist", "habitat": "Deep mist on dark nights, far from towns and lanterns", "temperament": "Gentle guide", "summary": "A glowing white stag that walks ahead of you in the mist and waits when you fall behind. Follow it calmly for a while and it looks back once, then leaves. Never chase it at a sprint. Never strike it: anyone who does is marked for the night, and lamp-thieves hunt them.", "facts": ["Cannot be hunted", "Follow it to earn Pale Stag Velvet", "Sometimes leads to a mist cache", "Hitting it marks you with Stagbane"], "status": "live"}, {"id": "lamp_thief", "name": "Lamp-thief", "kind": "mist", "habitat": "Deep mist at night", "temperament": "Sneaky, cowardly", "summary": "A small creature with burning eyes that creeps toward the nearest lit lantern and drains its oil, or snuffs out a road lamp, then flees. Hold your burning lantern steady on it and it bursts.", "facts": ["Steals lantern fuel or lamp oil", "Bursts in lantern light", "Drops Thief's Wick", "Blades barely hurt it"], "status": "live"}, {"id": "mist_moth", "name": "Mist Moth", "kind": "mist", "habitat": "Around anyone carrying a lit lantern in the dark", "temperament": "Harmless", "summary": "Pale moths that circle a burning lantern out in the dark and drift away when it goes out. Crouch and grab one with a bare hand for a chance to catch it.", "facts": ["1 to 3 per lantern", "Bare-hand catch, about 1 in 5", "Drops Moth-wing Dust"], "status": "live"}, {"id": "wisp_lure", "name": "Wisp-lure", "kind": "mist", "habitat": "Deep mist at night", "temperament": "Trickster", "summary": "A false lantern that bobs and drifts away as you follow it. After a long chase it either reveals a buried mist cache or leads you into an ambush of lamp-thieves. It's a coin flip.", "facts": ["Leads you 60 to 150 blocks", "Half the time a cache", "Half the time an ambush"], "status": "live"}, {"id": "the_watcher", "name": "The Watcher", "kind": "mist", "habitat": "Far ahead in deep mist", "temperament": "Silent, unknowable", "summary": "A tall dark figure that stands far off in the mist, facing you. It vanishes if you stare straight at it or walk closer. Hold it at the edge of your sight long enough and it counts as a sighting. Three sightings fill its bestiary page.", "facts": ["Vanishes if looked at directly", "3 sightings earn the Mistwalker title", "Lore ties it to the Hollow Choir"], "status": "live"}, {"id": "ghostcap", "name": "Ghostcap", "kind": "mist", "habitat": "Grass, dirt, moss or mud in deep mist", "temperament": "A mushroom, not a beast", "summary": "Clusters of pale glowing mushrooms that sprout in the deep mist and vanish at dawn. Pick them by hand. Apothecaries use them in remedies for the Mist Chill.", "facts": ["Gone at dawn", "Sometimes drops 2", "Apothecary ingredient"], "status": "live"}, {"id": "hollowdeep_i", "name": "Hollowdeep I: The Drowned Halls", "kind": "deep", "habitat": "The flooded top stratum of the old Aurenn city", "temperament": "Hostile", "summary": "Flooded halls where the drowned rise humming an old lullaby. Fight from dry steps, keep your lantern low underwater, and take down the bellringer first. The stratum boss is the Bellkeeper in his sunken tower.", "facts": ["Drowned: rise in groups, fight them on dry steps", "Lanterneel: goes for the brightest lantern", "Tidecrab: hit it from behind", "Drowned Bellringer (elite): speeds up the Drowned", "Boss: the Bellkeeper, rising water"], "status": "designed"}, {"id": "hollowdeep_ii", "name": "Hollowdeep II: The Clockwork Vaults", "kind": "deep", "habitat": "Aurenn machine halls", "temperament": "Hostile, mechanical", "summary": "Brass guardians still keep their posts in the vaults. Count your hits against the Wardens, flip levers to shut down turrets, and look for clever ways to win: a Warden whose riddle you solve stands down without a fight.", "facts": ["Brass Warden: parries every third hit", "Gearmite: swarms, use sweep attacks", "Sentry Turret: switch it off by lever", "Warden Captain (elite): makes all Wardens parry at once", "Boss: the Arbiter, whose decrees change every 25 s"], "status": "designed"}, {"id": "hollowdeep_iii", "name": "Hollowdeep III: The Rootworks", "kind": "deep", "habitat": "Overgrown root caverns", "temperament": "Hostile", "summary": "A living underground jungle. Things wait in the walls, spores drift in clouds, and wyrms burrow beneath your feet. Fire is your friend here.", "facts": ["Vinestalker: roots you in place", "Spore-bloat: pops into venom, kill it at range", "Root Wyrm: step out of the cracking ring", "Bramble Warden (elite): burn it before you kill it", "Boss: Mother Bramble, burn her three hearts in order"], "status": "designed"}, {"id": "hollowdeep_iv", "name": "Hollowdeep IV: The Ember Forges", "kind": "deep", "habitat": "Ancient forges full of gas", "temperament": "Hostile", "summary": "Hot halls full of golems and gas pockets. Open flame can ignite the air, so carry a safety lamp and keep spare oil.", "facts": ["Forge Golem: douse it to crack its plates", "Cinder Moth: drinks your lantern oil", "Slag Hound: leaves a burning trail", "Bellows Keeper (elite): pumps gas, no flame", "Boss: the Foundry Heart, which reforges itself"], "status": "designed"}, {"id": "hollowdeep_v", "name": "Hollowdeep V: The Mistlands Below", "kind": "deep", "habitat": "Mist-filled halls below", "temperament": "Hostile", "summary": "The mist rolls through these halls like the surface at night. Some foes appear only inside lantern light, and the real floor shows only where your light falls. Fight back to back.", "facts": ["Lamp-thief: snuffs your lantern on hit", "Echo of the Drowned: visible only in lantern light", "Hollowed: lost delvers who strike from the dark", "Mist Shepherd (elite): thickens the mist", "Boss: the Unlit, seen only with your lantern out"], "status": "designed"}, {"id": "hollowdeep_vi", "name": "Hollowdeep VI: The Starwound", "kind": "deep", "habitat": "Crystal halls near the fallen star", "temperament": "Hostile, uncanny", "summary": "The deepest stratum. Choir acolytes chant your lanterns dim, crystal crawlers reflect arrows, and some figures that look like delvers are not real. This stratum has no boss. It ends in the Antiphon, a gauntlet of three rune seals.", "facts": ["Choir Acolyte: interrupt its chant", "Crystal Crawler: hit it from the side", "False Delver: has no party marker", "Cantor (elite): reseals the doors", "Flawless Antiphon earns a Starheart Shard"], "status": "designed"}, {"id": "heart_of_the_hollow_star", "name": "The Heart of the Hollow Star", "kind": "deep", "habitat": "Beneath the Starwound", "temperament": "Final raid", "summary": "The endgame of the Hollowdeep, built for skilled parties of four. You get one life and no second chances, and only a few attempts each week. Keep the lanterns lit, answer each Working with the right counter, and turn the star's own light against its core.", "facts": ["Needs a Starheart Shard", "3 attempts per player per week", "Three phases", "Clears carved on the Wall of Clears"], "status": "designed"}], "server": {"name": "Lyris (Fantasy Craft)", "address": "185.207.165.62:20070", "version": "Paper 26.2 server. Join with Minecraft Java Edition 26.2. Java Edition only for now.", "links": [], "join_steps": ["Open Minecraft Java Edition 26.2. No mods are needed.", "Add a server with the address above.", "When asked to download the server resource pack, choose Yes. The world depends on it.", "If items or blocks show as purple-and-black squares, disconnect and rejoin to re-download the pack. This often happens right after a pack update.", "You arrive in Moonharbor's Market Square. /spawn always brings you back here.", "Visit Hoarfeather's perch at the Observatory for your star compass and Moonharbor chart."], "basics": [{"title": "Moonharbor", "body": "The harbour city where everyone starts. Market Square is spawn. Nearby are the Moonmarket, Lantern Pier, the Grand Library, the Miners' Guild, the Carriage Station, Ilwen's Lighthouse and Keep Elariel up on the hill."}, {"title": "Warps", "body": "/warp takes you to town landmarks: moonharbor, moonmarket, lighthouse, chapeloflamps, mistwaterbridge, tidecourt, lanternpier, stairgate, keepelariel, library, minersguild, carriagestation, milestone (end of the North Road) and delversgate."}, {"title": "No coordinates", "body": "Coordinates are hidden on purpose. F3 shows no position, /getpos is staff-only, the web map shows no player dots and death messages give no location. Find your way by landmarks, claim banners, lit roads, the lighthouse beam and the stars."}, {"title": "Finding north", "body": "At night, look up. The Lantern, the pole star in the Harbour Post constellation, always marks north. The two eyes of the Watcher Owl point to it. Your star compass shows north on the action bar on clear nights. The Wayfarer's belt of three stars rises due east and sets due west."}, {"title": "Getting home", "body": "/home (3 homes to start), /spawn, /back and /tpa always work. So do carriages, the lit roads and the lighthouse beam. Vanilla maps and compasses work too. Nobody gets stranded."}, {"title": "Starter kit", "body": "Hoarfeather hands out a free star compass and a filled Moonharbor chart (a map of the town and coast) at his perch by the Observatory. Your first time charting a constellation also earns a free Threading Ring, which draws star lines in the real sky."}, {"title": "Nights and the mist", "body": "Nights are dark, and mist gathers on open ground. Only real light pushes it back: lanterns, torches and town lamps. Night vision does not work outdoors after dark. Carry a lantern and keep oil for it. The sky stays clear, so the stars are always visible."}, {"title": "Mist creatures", "body": "Strange things walk in the deep mist, far from town, claims and lit lanterns. Follow the Pale Stag but never strike it. Guard your lantern from lamp-thieves. /bestiary shows the creatures you have met."}, {"title": "Resource pack", "body": "The server builds its own pack. After updates or restarts you may be asked to accept a new version. Always accept. If textures look purple-and-black, rejoin."}, {"title": "Ranks", "body": "Everyone starts as a Wanderer with spawn, 3 homes, tpa, back, msg, mail and warps. Supporter ranks run Firefly, Moonpetal, Starweaver, Celestial and add homes (up to 8), /hat, /workbench, nicknames, portable crafting stations and /enderchest. Booster is for Discord boosters and Creator is for content creators. Staff are Helper, Builder, Moderator, Admin and Owner."}, {"title": "Coins", "body": "Lyris Coins are physical copper, silver and gold coins. You earn them by selling fish, crops, ore and cargo, and there is a daily earning cap."}, {"title": "Useful commands", "body": "/spawn, /home, /sethome, /warp, /tpa, /back, /bestiary (mist creatures), /lore (the public lore archive), /sky (stargazing), /cargo (cargo crates), /goblet info (Goblet Trees)."}], "rules": [], "rules_note": "No player rule list exists in the project. Facts from the system docs that a rules page could use: coordinates stay hidden; no mod, shader or item may get around the dark or the mist; the Pale Stag must not be attacked; land is protected through Lands claims; the Hollowdeep Concourse has no PvP. A notoriety and bounty system that would allow PvP everywhere is still only an idea, not a rule."}, "sky": [{"id": "harbour_post", "name": "The Harbour Post", "season": -1, "brightest": "the Lantern", "myth": "Ysara hung the first lamp on the harbour post. Ysolde lifted its light into the sky so every sailor could find home.", "verse": "A lamp on a post that never sways; stand it upright, and north is the way.", "nav": "The Lantern's height above the horizon is your latitude. It always marks north.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "sleeper", "name": "The Sleeper", "season": -1, "brightest": "the Lid", "myth": "Ysolde, curled asleep around the Post. While she sleeps, the world holds.", "verse": "She lies on her side with her eye shut fast; follow her back from her head to her last.", "nav": "She turns around the pole like a clock hand: a rough hour at a glance.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "moon_window", "name": "The Moon Window", "season": -1, "brightest": "the Keeping Star", "myth": "The palace window where a daughter of the Moonlit line keeps a light for Ysolde.", "verse": "Four lights in a square, one burns for the queen; keep the window lit, or the song wakes between.", "nav": "None; but sailors count its corners when they cannot sleep.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "watcher_owl", "name": "The Watcher Owl", "season": -1, "brightest": "Lamp-Eyes", "myth": "The owl who kept watch while Ysara slept, and kept every secret it saw.", "verse": "Two ears, two eyes, a beak and a breast; the eyes look to the Lantern, and never rest.", "nav": "Pointer stars: the two eyes point straight at the Lantern.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "sower", "name": "The Sower", "season": 0, "brightest": "Seedfall", "myth": "The first farmer, scattering stars as seed across a field nobody had ploughed.", "verse": "A hand thrown wide and seed in a line; follow the throw from the shoulder to the sign.", "nav": "Seedfall is a clock star.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "shared_table", "name": "The Shared Table", "season": 0, "brightest": "the Host", "myth": "Nine dishes set for whoever walks in. No one eats alone at the Hearth.", "verse": "Lay the long board from left to right, then stand its two legs for the guests of the night.", "nav": "None.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "hare", "name": "The Hare", "season": 0, "brightest": "Quickfoot", "myth": "The hare who outran the Antlered One, and has been laughing ever since.", "verse": "Up the hill and over the top, down again with a skip and a hop.", "nav": "None.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "wayfarer", "name": "The Wayfarer", "season": 0, "brightest": "the Staff-Head", "myth": "The first Road Saint, walking the Saints' Road with a staff and a lantern.", "verse": "Staff held high and a belt of three; walk from the staff to the road and see.", "nav": "His belt of three stars rises due east and sets due west.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "tide_mother", "name": "Tide Mother", "season": 1, "brightest": "the Pearl", "myth": "The mother of the sea, cradling the first fish in the crook of a wave.", "verse": "A wave that rises and curls to fall, with the Pearl at its foot, the brightest of all.", "nav": "The Pearl is a clock star.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "barque", "name": "The Barque", "season": 1, "brightest": "Keel", "myth": "An Aurenn tide-ship that sailed off the edge of the sea and kept on sailing.", "verse": "Bow, hull and Keel, then stern; climb the mast before you return.", "nav": "At midsummer midnight the mast stands upright and Keel points due south.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "pale_stag", "name": "The Pale Stag", "season": 1, "brightest": "White Eye", "myth": "The stag who leads the lost home. Never shoot it.", "verse": "From the tail to the eye, then the antlers that climb; he looks back to the Lantern every time.", "nav": "His head looks back toward the Lantern: follow his gaze north.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "drowned_bell", "name": "The Drowned Bell", "season": 1, "brightest": "the Toll", "myth": "The last bell of the drowned Aurenn city, still ringing under the water.", "verse": "Crown, shoulder, rim and the Toll at the base, then shoulder again to finish the case.", "nav": "The Toll is the main clock star for longitude.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "bright_cask", "name": "The Bright Cask", "season": 2, "brightest": "First Spark", "myth": "The cask that never ran dry at the first harvest. Three sparks still fly from it.", "verse": "Two sparks above, then round the cup's rim, and last the handle to hold it by its brim.", "nav": "None.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "antlered_one", "name": "The Antlered One", "season": 2, "brightest": "the Crown Tine", "myth": "The hunter-god of the Old Hunt, who counts what you take.", "verse": "Left antler down to the brow, up the crown, then the right antler, and the throat to come down.", "nav": "When the Crown Tine rises at dusk, First Frost is near.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "alembic", "name": "The Alembic", "season": 2, "brightest": "the Unlit", "myth": "Vane's vessel, drawn into the sky after the Unbottled Night. It brightens with every Great Work.", "verse": "Neck, shoulder and belly, the base and the beak; the seventh stays dark till the Works are complete.", "nav": "None.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "open_ledger", "name": "The Open Ledger", "season": 2, "brightest": "the Quill", "myth": "The Registrar's book, in which every name is written. Two names will not take the ink.", "verse": "Two open pages with their corners raised, and the Quill below where the names are praised.", "nav": "The Quill is a clock star.", "aurenn": false, "newMoonOnly": false, "uncharted": false, "codex": false, "living": false}, {"id": "thorn", "name": "The Thorn", "season": 3, "brightest": "the Point", "myth": "Ysolde's Thorn, the star-iron sword Syrena carries. Falling stars fly from it in winter.", "verse": "Guard to guard across the hilt, then down the blade to the Point it built.", "nav": "At midwinter midnight it points at the Hollow. const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

function navHtml(cur) {

}

const statusPill = s => !s ? '' : s === 'live' ? '<span class="pill live">In the world</span>'
  : (s === 'in progress' ? '<span class="pill wip">Being built</span>' : '<span class="pill plan">Coming later</span>');
const beastPill = s => s === 'live' ? '<span class="pill live">In the world</span>' : '<span class="pill plan">Coming</span>';

// ---------------------------------------------------------------- guide visuals
const CAT_C = { crafting: '#f0dca0', sea: '#9fd8ff', night: '#c4adf6', deep: '#f2b27a', land: '#a8dcae', town: '#f3c6a5', sky: '#c8c0ff' };
const catColor = id => CAT_C[id] || '#f0dca0';
function emblemInner(id, color, sw) {
  const e = (D.emblems || {})[id]; if (!e) return '';
  return `<g fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${e.p.map(p => `<path d="${p}"/>`).join('')}</g>` +
    e.d.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6.5" fill="#fff" opacity=".14"/><circle cx="${x}" cy="${y}" r="2.6" fill="#fff"/>`).join('');
}
const emblem = (id, color) => `<svg viewBox="-2 -2 68 68" aria-hidden="true">${emblemInner(id, color, 2.6)}</svg>`;
const medal = (id, cat, big) => `<span class="medal${big ? ' big' : ''}" style="--c:${catColor(cat)}">${emblem(id, catColor(cat))}</span>`;
function seeded(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909), (h >>> 0) / 4294967296)); }
// a band of sky where the group's emblems hang like constellations, threaded together the way the Threading Ring draws
function skyBand(catId, ids, W = 1200, H = 200, left = 600) {
  const r = seeded(catId), col = catColor(catId);
  let s = '';
  for (let i = 0; i < 90; i++) { const x = r() * W, y = r() * H, z = r(); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.6 + z * 1.4).toFixed(2)}" fill="#e6ecff" opacity="${(0.25 + z * 0.55).toFixed(2)}"/>`; }
  const n = ids.length, span = W - left - 40, pts = ids.map((id, i) => [left + (n > 1 ? i * span / (n - 1) : span / 2) + (r() - .5) * 24, H * (i % 2 ? 0.62 : 0.36) + (r() - .5) * 26]);
  if (n > 1) s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round"/>`;
  const sc = Math.min(1.25, (span / Math.max(n, 1)) / 72);
  ids.forEach((id, i) => { const [x, y] = pts[i]; s += `<g transform="translate(${(x - 32 * sc).toFixed(1)} ${(y - 32 * sc).toFixed(1)}) scale(${sc.toFixed(3)})" opacity=".9">${emblemInner(id, col, 2.4 / sc)}</g>`; });
  return `<svg class="sky" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${s}</svg>`;
}

// ---------------------------------------------------------------- router
function route() {
  const h = (location.hash || '#home').slice(1).split('.');
  const [sec, a, b] = h;
  let html;
  switch (sec) {
    case 'world': html = vWorld(a, b); break;
    case 'guides': html = vGuides(a, b); break;
    case 'bestiary': html = vBestiary(a === 'all' ? null : a, b); break;
    case 'sky': html = vSky(); break;
    case 'join': html = vJoin(); break;
    default: html = vHome();
  }
  $('#view').innerHTML = html;
  navHtml(SECTIONS.some(s => s[0] === sec) || sec === 'staff' ? sec : 'home');
  if (sec === 'staff') fillIndex();
  try { localStorage.setItem('lyris-last', location.hash); } catch (e) {}
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    const text = D.server.address;
    try { await navigator.clipboard.writeText(text); c.textContent = 'Copied'; }
    catch (err) { const code = c.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Selected'; }
    setTimeout(() => c.textContent = 'Copy', 1600);
  }
  const ch = e.target.closest('#chart'); if (ch) ch.classList.toggle('zoom');
  const ar = e.target.closest('[data-area]');
  if (ar) { staffFilter.area = ar.dataset.area; document.querySelectorAll('[data-area]').forEach(x => x.setAttribute('aria-pressed', x === ar)); fillIndex(); }
});
document.addEventListener('input', e => { if (e.target.id === 'staffq') { staffFilter.q = e.target.value; fillIndex(); } });

// ---------------------------------------------------------------- search
const IDX = [];
D.lore.places.forEach(p => IDX.push(['Place', p.name, p.tagline, '#world.places.' + p.id, p.body]));
D.lore.figures.forEach(p => IDX.push(['Person', p.name, p.role, '#world.people.' + p.id, p.body]));
D.lore.factions.forEach(p => IDX.push(['Faith', p.name, p.body.split('. ')[0], '#world.faiths.' + p.id, p.body]));
D.lore.history.forEach(p => IDX.push(['History', p.title, p.era, '#world.history', p.body]));
D.lore.choir.forEach(p => IDX.push(['Choir', p.name, p.song, '#world.choir', p.line]));
D.systems.systems.forEach(s => IDX.push(['Guide', s.name, s.tagline, `#guides.${s.category}.${s.id}`, s.summary + ' ' + (s.commands || []).join(' ')]));
D.bestiary.forEach(b => IDX.push(['Creature', b.name, b.habitat, `#bestiary.${b.kind}.${b.id}`, b.summary]));
D.sky.forEach(c => IDX.push(['Stars', c.name, c.brightest && !c.brightest.startsWith('(') ? 'Brightest: ' + c.brightest : SEASON[c.season], '#sky', c.myth + ' ' + c.brightest]));
D.server.basics.forEach(b => IDX.push(['Basics', b.title, b.body, '#join', b.body]));
let sel = -1;
function search(q) {
  const box = $('#results'); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const words = q.split(/\s+/);
  const hits = IDX.map(r => { const t = r[1].toLowerCase(), all = (r[1] + ' ' + r[2] + ' ' + r[4]).toLowerCase();
    if (!words.every(w => all.includes(w))) return null;
    return [r, (t.startsWith(q) ? 0 : t.includes(q) ? 1 : 2)]; }).filter(Boolean).sort((a, b) => a[1] - b[1]).slice(0, 12);
  sel = -1;
  box.innerHTML = hits.length ? hits.map(([r]) => `<a href="${r[3]}"><span class="k">${r[0]}</span><span class="t">${esc(r[1])}</span><span class="s">${esc(r[2])}</span></a>`).join('')
    : `<div class="none">Nothing found for “${esc(q)}”.</div>`;
  box.hidden = false;
}
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('keydown', e => {
  const items = [...document.querySelectorAll('#results a')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, Math.min(items.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach((a, i) => a.classList.toggle('sel', i === sel)); }
  if (e.key === 'Enter' && items.length) { location.hash = items[Math.max(0, sel)].getAttribute('href'); closeSearch(); }
  if (e.key === 'Escape') closeSearch();
});
function closeSearch() { $('#results').hidden = true; $('#q').value = ''; $('#q').blur(); }
document.addEventListener('click', e => { if (e.target.closest('#results a')) closeSearch(); else if (!e.target.closest('.search')) $('#results').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); } });

// ---------------------------------------------------------------- the night sky behind the app
(function stars() {
  const cv = $('#sky'), cx = cv.getContext('2d'); let W, H, pts = [];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    pts = Array.from({ length: Math.round(innerWidth * innerHeight / 5200) }, () => ({ x: r() * W, y: r() * H, z: r(), p: r() * 6.28 })); }
  function draw(t) {
    const g = cx.createRadialGradient(W * .78, -H * .1, 0, W * .78, -H * .1, Math.max(W, H) * 1.1);
    g.addColorStop(0, '#1a2560'); g.addColorStop(.55, '#0b1235'); g.addColorStop(1, '#070b1f');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    for (const p of pts) { const tw = still ? .8 : .55 + .45 * Math.sin(t / 1400 + p.p);
      cx.globalAlpha = (.25 + .65 * p.z) * tw; cx.fillStyle = p.z > .93 ? '#f0dca0' : '#dfe6ff';
      const r = (.5 + p.z * 1.3) * devicePixelRatio; cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.28); cx.fill(); }
    cx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(draw);
})();


// ---------------------------------------------------------------- install as an app (PWA)
let deferred = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function showInstall() { document.querySelectorAll('.install').forEach(b => b.hidden = standalone || !(deferred || isIOS)); }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; showInstall(); });
addEventListener('appinstalled', () => { deferred = null; showInstall(); });
document.addEventListener('click', async e => {
  if (!e.target.closest('.install')) return;
  if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; showInstall(); return; }
  if (isIOS) e.target.closest('.install').textContent = 'Tap Share, then Add to Home Screen';
});
addEventListener('hashchange', showInstall);
const _route = route; route = function () { _route(); showInstall(); };
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

// boot
$('#railAddr').textContent = D.server.address;
if (!location.hash) { try { const l = localStorage.getItem('lyris-last'); if (l) history.replaceState(null, '', l); } catch (e) {} }
route();
</script>
