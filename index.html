<meta name="theme-color" content="#070b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<title>Lyris Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: an app shell. Desktop: a moonlit rail on the left, content on the right. Phone: content with a bottom tab bar.
   One committed look (the Lyris night), so a single dark palette. */
:root {
  --night: #070b1f;        /* page ground, the sky beyond the dome */
  --deep: #0d1538;         /* panels */
  --deep2: #131d4a;        /* raised surfaces */
  --line: #2a3770;         /* hairlines and borders */
  --ink: #e7e9f6;          /* body text */
  --mute: #9aa3cc;         /* secondary text */
  --moon: #f0dca0;         /* moonlit gold, the accent */
  --violet: #b9a0f0;       /* the Moonroad, Choir, secondary accent */
  --glass: #9fd8ff;        /* Aurenn blue */
  --ok: #7fd6a4; --wip: #f0c86a; --plan: #a4acd6;
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --rail: 248px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font: 16px/1.55 var(--f-body); margin: 0; }
* { box-sizing: border-box; }
a { color: var(--moon); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; border-radius: 6px; }
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }

/* ---------- rail ---------- */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 28px 18px; display: flex; flex-direction: column; gap: 22px;
  border-right: 1px solid var(--line); background: linear-gradient(180deg, rgba(13,21,56,.92), rgba(7,11,31,.92)); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 30px/1 var(--f-display); letter-spacing: .06em; color: var(--moon); display: block; }
.brand small { font: 12px/1.2 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--mute);
  font: 500 16px/1.2 var(--f-ui); letter-spacing: .02em; }
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { color: var(--ink); background: rgba(240,220,160,.06); }
.nav a[aria-current="page"] { color: var(--night); background: var(--moon); }
.nav .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.rail .foot { margin-top: auto; font: 13px/1.4 var(--f-ui); color: var(--mute); }
.addr { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(19,29,74,.6); }
.addr code { font: 600 13px/1.2 var(--f-ui); color: var(--ink); letter-spacing: .02em; overflow-wrap: anywhere; }
.copy { margin-left: auto; border: 1px solid var(--line); background: var(--deep2); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: 600 12px var(--f-ui); color: var(--moon); }
.copy:hover { border-color: var(--moon); }

/* ---------- main ---------- */
main { min-width: 0; padding-block: 28px 120px; padding-inline: clamp(16px, 4vw, 56px); }
.topbar { display: flex; gap: 12px; align-items: center; margin-bottom: 26px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(13,21,56,.85);
  color: var(--ink); font: 16px var(--f-ui); }
.search input::placeholder { color: var(--mute); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--mute); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--deep); border: 1px solid var(--line); border-radius: 12px;
  max-height: 60vh; overflow: auto; z-index: 20; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.results a { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid rgba(42,55,112,.6); }
.results a:hover, .results a.sel { background: var(--deep2); }
.results .k { grid-row: span 2; align-self: center; font: 700 11px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--violet); min-width: 72px; }
.results .t { font: 600 15px var(--f-ui); }
.results .s { font: 13px/1.35 var(--f-ui); color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .none { padding: 14px; color: var(--mute); font: 14px var(--f-ui); }
.mob-brand { display: none; }

h1, h2, h3 { text-wrap: balance; }
.eyebrow { font: 700 12px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--violet); margin: 0 0 10px; }
.page-title { font: 46px/1.05 var(--f-display); color: var(--moon); margin: 0 0 10px; letter-spacing: .02em; }
.lede { font-size: 19px; max-width: 64ch; color: var(--ink); margin: 0 0 26px; }
h2.sec { font: 26px/1.15 var(--f-display); color: var(--moon); margin: 38px 0 14px; letter-spacing: .02em; }
p { max-width: 68ch; }

/* tabs and chips */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.tabs a, .chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); text-decoration: none;
  font: 600 14px var(--f-ui); background: rgba(13,21,56,.7); cursor: pointer; }
.tabs a:hover, .chip:hover { color: var(--ink); border-color: var(--mute); }
.tabs a[aria-current="true"], .chip[aria-pressed="true"] { color: var(--night); background: var(--moon); border-color: var(--moon); }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 18px 18px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(19,29,74,.85), rgba(13,21,56,.85)); text-decoration: none; color: var(--ink); min-width: 0; }
a.card:hover { border-color: rgba(240,220,160,.55); transform: translateY(-1px); }
a.card { transition: transform .15s, border-color .15s; }
.card h3 { margin: 0; font: 600 20px/1.2 var(--f-ui); color: var(--ink); }
.card .tag { font: 15px/1.4 var(--f-body); font-style: italic; color: var(--mute); margin: 0; }
.card p { margin: 0; font-size: 15.5px; }
.card .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 700 11px/1.4 var(--f-ui); letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid currentColor; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--ok); } .pill.wip { color: var(--wip); } .pill.plan { color: var(--plan); }
.pill.kind { color: var(--violet); } .pill.kind::before { display: none; }

/* detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 28px; align-items: start; }
.detail .body p { font-size: 17.5px; }
.panel { border: 1px solid var(--line); border-radius: 14px; padding: 18px; background: rgba(13,21,56,.85); }
.panel h4 { margin: 0 0 10px; font: 700 12px var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--violet); }
.panel + .panel { margin-top: 16px; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 16.5px; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--moon); color: var(--moon);
  display: grid; place-items: center; font: 700 13px var(--f-ui); margin-top: 1px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.cmd { font: 600 14px/1.3 var(--f-ui); }
.cmd code { color: var(--moon); }
.back { display: inline-flex; gap: 6px; align-items: center; font: 600 14px var(--f-ui); color: var(--mute); text-decoration: none; margin-bottom: 16px; }
.back:hover { color: var(--moon); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; align-items: center; margin-bottom: 18px; }
.hero h1 { font: clamp(54px, 9vw, 104px)/.92 var(--f-display); color: var(--moon); margin: 0 0 14px; letter-spacing: .03em; }
.hero .lede { font-size: 19.5px; }
.joincard { border: 1px solid rgba(240,220,160,.4); border-radius: 18px; padding: 22px; background: radial-gradient(120% 120% at 100% 0%, rgba(185,160,240,.16), rgba(13,21,56,.92) 60%); }
.joincard h3 { margin: 0 0 4px; font: 26px var(--f-display); color: var(--moon); }
.joincard .addr { margin: 14px 0; padding: 14px; }
.joincard .addr code { font-size: 18px; }
.rail .addr code { white-space: nowrap; }
.joincard .meta { font: 14px/1.5 var(--f-ui); color: var(--mute); margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font: 700 14px var(--f-ui); text-decoration: none; cursor: pointer;
  border: 1px solid var(--moon); color: var(--night); background: var(--moon); }
.btn.ghost { background: transparent; color: var(--moon); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.tile { padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(13,21,56,.82); text-decoration: none; color: var(--ink); display: grid; gap: 6px; }
.tile:hover { border-color: rgba(240,220,160,.55); }
.tile svg { width: 28px; height: 28px; color: var(--moon); }
.tile b { font: 600 19px var(--f-ui); }
.tile span { font: 14px/1.4 var(--f-ui); color: var(--mute); }
.tile .n { font: 13px var(--f-ui); color: var(--violet); }

/* timeline */
.timeline { position: relative; display: grid; gap: 18px; padding-left: 28px; max-width: 820px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--violet), var(--moon)); opacity: .55; }
.ev { position: relative; }
.ev::before { content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--night); border: 2px solid var(--moon); }
.ev .era { font: 700 12px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--violet); }
.ev h3 { margin: 2px 0 4px; font: 24px/1.15 var(--f-display); color: var(--moon); }
.ev p { margin: 0; }

/* choir */
.choir { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.seat { padding: 16px; border-radius: 14px; border: 1px solid rgba(185,160,240,.35); background: rgba(19,29,74,.8); display: grid; gap: 6px; }
.seat .num { font: 34px/1 var(--f-display); color: var(--violet); }
.seat b { font: 600 17px/1.25 var(--f-ui); }
.seat .note { font: 700 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--moon); }
.seat i { color: var(--mute); }

/* sky */
.chart { border: 1px solid var(--line); border-radius: 16px; overflow: auto; background: #050817; max-height: 80vh; }
.chart img { display: block; width: 100%; min-width: 760px; max-width: none; height: auto; cursor: zoom-in; }
.chart.zoom img { width: 2280px; cursor: zoom-out; }
.seasons h3 { font: 22px var(--f-display); color: var(--violet); margin: 26px 0 12px; letter-spacing: .04em; }
.verse { font-style: italic; color: var(--moon); margin: 0; font-size: 15.5px; }

/* staff */
.lock { border: 1px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--mute); max-width: 640px; }
table.idx { width: 100%; border-collapse: collapse; font: 14.5px/1.4 var(--f-ui); }
table.idx th { text-align: left; font: 700 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--violet); padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--deep); }
table.idx td { padding: 9px 10px; border-bottom: 1px solid rgba(42,55,112,.55); vertical-align: top; }
table.idx td.p { color: var(--mute); font-size: 12.5px; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 70vh; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters input { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--deep); color: var(--ink); font: 15px var(--f-ui); }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.folders div { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: 14px/1.35 var(--f-ui); background: rgba(13,21,56,.8); }
.folders b { color: var(--moon); font-weight: 700; display: block; }

/* guide visuals: emblems, medallions, constellation banners */
.medal { --c: var(--moon); flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.08), rgba(7,11,31,.9) 70%); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  box-shadow: 0 0 0 4px rgba(7,11,31,.6), 0 0 22px color-mix(in srgb, var(--c) 22%, transparent); }
.medal svg { width: 46px; height: 46px; overflow: visible; }
.medal.big { width: 132px; height: 132px; }
.medal.big svg { width: 96px; height: 96px; }
.gcard { flex-direction: row; align-items: flex-start; gap: 14px; }
.gcard .txt { display: grid; gap: 6px; min-width: 0; }
.banner { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin: 34px 0 16px; min-height: 150px;
  background: radial-gradient(120% 140% at 85% 0%, color-mix(in srgb, var(--c) 18%, #0d1538), #070b1f 70%); }
.banner svg.sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner .cap { position: relative; padding: 22px 24px; max-width: 560px; }
.banner::before { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(90deg, rgba(7,11,31,.92) 30%, rgba(7,11,31,0) 62%); pointer-events: none; }
.banner .cap { z-index: 1; }
.banner svg.sky { z-index: 0; }
.banner .cap h2 { margin: 0 0 6px; font: 30px/1.1 var(--f-display); color: var(--c); letter-spacing: .02em; }
.banner .cap p { margin: 0; color: var(--ink); font-size: 16px; }
.banner .cap .count { display: inline-block; margin-top: 10px; font: 700 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.ghero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 24px;
  border-radius: 18px; border: 1px solid var(--line); overflow: hidden; margin-bottom: 26px;
  background: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--c) 20%, #0d1538), #070b1f 72%); }
.ghero svg.sky { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.ghero > * { position: relative; }
.ghero .page-title { color: var(--c); margin: 2px 0 8px; }
@media (max-width: 860px) { .banner svg.sky { opacity: .35; } .banner::before { background: linear-gradient(90deg, rgba(7,11,31,.8), rgba(7,11,31,.35)); } .ghero { grid-template-columns: minmax(0, 1fr); justify-items: start; } .medal.big { width: 96px; height: 96px; } .medal.big svg { width: 70px; height: 70px; } .banner .cap h2 { font-size: 24px; } }

/* mobile */
.tabbar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mob-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .mob-brand b { font: 26px/1 var(--f-display); color: var(--moon); }
  .topbar { flex-wrap: wrap; }
  .search { flex-basis: 100%; order: 3; }
  .mob-join { margin-left: auto; }
  .hero, .detail { grid-template-columns: minmax(0, 1fr); }
  .page-title { font-size: 36px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: rgba(7,11,31,.96); border-top: 1px solid var(--line); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; text-decoration: none; color: var(--mute); font: 600 11px var(--f-ui); }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--moon); }
}
@media (min-width: 861px) { .mob-join { display: none; } }
@media (prefers-reduced-motion: reduce) { a.card, a.card:hover { transition: none; transform: none; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="shell">
  <aside class="rail" aria-label="Main">
    <a class="brand" href="#home">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#f0dca0" stroke-opacity=".5"/><path d="M26 9a12 12 0 1 0 0 22a10 10 0 1 1 0-22z" fill="#f0dca0"/><circle cx="29" cy="12" r="1.6" fill="#b9a0f0"/></svg>
      <span><b>Lyris</b><small>Companion</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="addr"><code id="railAddr"></code><button class="copy" data-copy>Copy</button></div>
      <p style="margin:10px 2px 0">Java Edition · accept the resource pack</p>
      <button class="btn ghost install" hidden style="margin-top:12px;width:100%;justify-content:center">Install the app</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <a class="mob-brand" href="#home"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><path d="M26 9a12 12 0 1 0 0 22a10 10 0 1 1 0-22z" fill="#f0dca0"/></svg><b>Lyris</b></a>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search places, people, guides, creatures, stars…" autocomplete="off" aria-label="Search the companion">
        <div class="results" id="results" hidden></div>
      </div>
      <a class="btn mob-join" href="#join">Join</a>
    </div>
    <div id="view"></div>
  </main>
</div>

<script type="application/json" id="data">{"lore": {"intro": "Welcome to Lyris, a wide and quiet land where a fallen star still sings under the sea and a mist rises from the dark every night. Moonharbor is one of the last lit towns on the coast. It has held for eighty years because of its lamps, its laws and the people who keep them burning. Now the Lamp-Heir is asking settlers to take a lantern, head back out into the Reach and light it again.", "places": [{"id": "moonharbor", "name": "Moonharbor", "tagline": "The last lit harbour on the coast.", "body": "Moonharbor sits on a bay above a drowned city and a sleeping star, and somehow it is the safest ground in the Reach. The Moon Pact keeps the star's song away from its stones, the sea gives it oil for its lamps, and its lamplighters have walked their rounds by rule since the first mist winter. Its many quarters each have their own name and style, because every quarter was once somewhere else. When villages inland ran out of light, their people walked to the coast, and Moonharbor gave each family a district to keep lit. By town law, nobody who reaches the gate before dusk is turned away.", "facts": ["Moonharbor was founded twice: first by the Stair-folk, then by the elf Ysara and her white-sailed ships", "Old Harbour and Point families still say \"the Stair was here first\" and use tide-time sayings like \"good for two tides\"", "Districts include Market, Harbour, the Point, Lamplight, the Rise and the Heights", "Lamp oil is the first thing new settlers buy, and it comes from the Lamp Seller in the Moonmarket"]}, {"id": "quiet-reach", "name": "The Quiet Reach", "tagline": "Wide, but not deep.", "body": "The continent Moonharbor stands on runs from the Sunward Edge in the south to the northern ice. Even before the mist, few people lived there. The star's song travels through stone, and where the stone sings, wheat lies flat in rings, wells come up salt and children sleepwalk toward the hills. People settled only along the edges: the coast, the roads and the river fords. Then the mist came and emptied the rest. The forests you walk through look untouched, but they only went wild within one lifetime. Old farms, inns and villages are still out there, left exactly as they were when their last lamp went out.", "facts": ["Before the mist the Reach had perhaps two hundred villages, three walled towns and a herring road", "The drovers' saying: \"The Reach is wide, but it is not deep\"", "Tavern rumour tells of a walled town far north that \"still answers with bells\""]}, {"id": "aurenhal", "name": "Aurenhal, the Brass City", "tagline": "The house that listens, now under the bay.", "body": "Long before Moonharbor, the Aurenn built Aurenhal in tiers down a sea-cliff bowl facing the bay. The star's song gave them free light and heat, so even their poorest stair-streets glowed blue-gold all night. Inland folk called it \"the city that never learned the dark\". The rich lived near the top, at the Concourse and the great lenses. Below them came the guild halls, the lamplit housing tiers, the engine undercity, the glass gardens and the foundries. At the very bottom was a dig toward the star that nobody in the city ever talked about. Then the sea came in, in a single night. Its bells still lie on the seabed.", "facts": ["Aurenn glass is faintly blue and rings when you tap it, and Aurenn brass never goes green", "Their coin was the tide-mark, stamped with a wave on one side and its tier's sigil on the other", "The Aurenn counted time in tides, so a child might be \"forty tides old\"", "Each layer of the Hollowdeep was once a district of the living city"]}, {"id": "hollowdeep", "name": "The Hollowdeep and the Delvers' Gate", "tagline": "The dig the Aurenn made to cage a star.", "body": "In the north, at the end of the North Road, a winding cleft leads to a sunken court and a great round brass door. Above it, in old runes, are the words THE STAR SLEEPS UNDER THE WATER. This is the Delvers' Gate, and it is waking up. Below it lies the Hollowdeep, the drowned Aurenn city followed down level by level: the Drowned Halls, the Clockwork Vaults, the Rootworks, the Ember Forges, the Mistlands Below and the Starwound. Brass Wardens still guard their doors and ask the riddles they were set, and nobody ever told them the city fell. Beside the door a lamplighter's lantern is still burning. The wardens found it lit and left it lit.", "facts": ["A crude rubble wall across the cleft mouth carries the Remnant's Charge", "Delvers sign the Delvers' Roll at the Lodge", "Things you might meet down there include the Drowned, Starborn beasts, the Hollow Choir and the Pale Pedlar"]}, {"id": "observatory", "name": "The Observatory", "tagline": "Built on an Aurenn star platform.", "body": "The Observatory stands on a hill above Moonharbor, on top of far older Aurenn stonework. This is where Magister Oriel Vane's Order of the Alembic studied, and where the Unbottled Night began about eighty years ago. Beneath the floor, past an Aurenn orrery, lies a great toothed wheel that the diggers nicknamed the Millstone. Today the Observatory's time-ball sets every ship's clock, and its telescope is the place to go stargazing. It is also half-ruined. A restoration scaffold and a fund sign stand against its west wall, asking for copper, glass and oak.", "facts": ["One surviving Aurenn orrery arm has a seventh star scratched on by hand, where no star stands in our sky", "Captains reset their clocks at the time-ball, which is called \"giving Wenlock his breath back\"", "Hoarfeather, the owl keeper, waits by his perch nearby for new arrivals"]}, {"id": "lighthouse", "name": "Ilwen's Lighthouse", "tagline": "The only fixed light on the whole coast.", "body": "Ilwen the Quiet raised this tower on the Mistwater headland with her mason's square. It is said to be Ysara's first harbour lamp grown tall. Since the ships from the Old Shore stopped coming, it has been the one fixed light on the coast, and every vessel still sailing the Reach steers by it. A copper oil cistern stands nearby with a sign: \"Pour a tin. Keep her lit.\" The keeper's log tells of one night the tank ran dry, when a three-masted ship with grey sails and no lights went north along the reef.", "facts": ["The Chapel of Lamps, home of the Lantern Covenant, stands between the town and the lighthouse", "The Mistwater Bridge leads out toward the Old Coast Road", "If the lighthouse goes dark, Moonharbor is alone in the dark"]}, {"id": "seawall", "name": "The Seawall Stair and Syrena's Statue", "tagline": "Forty-one notches, never repaired.", "body": "On the first night of the mist, crawlers and tidecrabs came up out of the bay inside the fog. Syrena held the seawall stair alone until dawn and cut a notch in the top step every time something got past her. There are forty-one, and the town has never repaired them. The stair itself is older than the crown. It is the old runners' stair, cut by the Stair-folk from the drowned city's Concourse steps, which is why the old families say she held their stair. Out in the bay stands the statue the town raised to her, with her great sword pointed at the sky. She hates it, and says the nose is wrong.", "facts": ["Eyewitness Pell Ostry said the statue shows her standing tall, but \"she was sitting down\"", "A strange star hangs at the very tip of the statue's sword every night and never turns with the sky", "Old Gnash, a sea turtle the size of a chapel, sleeps somewhere off the bay"]}, {"id": "keep-elariel", "name": "Keep Elariel and the Moon Window", "tagline": "Where a daughter keeps a light.", "body": "High above the town stands Keep Elariel, seat of the Moonlit line, the elven queens of Moonharbor. In its garden is the moon window. Under the Moon Pact, the Sleeping Moon Ysolde keeps the star's song asleep for as long as a daughter of the line keeps a light burning there. Queen Maelis carried that lamp into the mist on the first night and never came back. Her daughter Syrena keeps the window lit now, and refuses to be crowned until her mother comes home. A Brass Warden the town calls Sir Cog kneels in the palace garden.", "facts": ["The Moonwake is the royal faith, and the castle cathedral is its cathedral", "The Moon Chapel stands on a terrace west of the keep", "The Moonlit queens Ysara and Ilwen lie at rest in a crypt somewhere below"]}, {"id": "pryde-shop", "name": "Pryde's, Clocks Mended", "tagline": "A shop nobody has wound in eighty years.", "body": "On the narrow lane behind the Town Hall stands a two-storey shop with a whitewashed bow window. Its hanging sign is a brass clock face with no hands. It belonged to Wenlock Pryde, Moonharbor's clockmaker, who walked up to the Observatory on the Unbottled Night and never came back. His apprentice kept the shop open one winter, then locked it and left town. Nobody has wound the clocks inside since. They all still keep perfect time and strike together on the hour, a little out of step. People on the lane stop talking until they finish. The town owns the building now, and it has never been reopened.", "facts": ["The sign underneath reads CLOCKS MENDED · TIME KEPT", "Children swear the handless sign ticks", "The Inventors' Guild quietly suspects Aurenn workings are inside"]}, {"id": "hollowmere", "name": "Hollowmere and the Herring Road", "tagline": "Ruins of the Age of Silence.", "body": "A droving road once ran inland from the coves. Salt herring went up in barrels, and grain and wool came back down. Its waymarks were singing stones with a chip knocked off the top, where drovers knocked for luck. If a stone was silent, you stopped at the next inn. The stops were the Lamp and Ladle, the village of Hollowmere with its herring-a-barrel bridge toll, and Hale's mill at the crossing. The road closed when the mist came. On the third night Hollowmere burned to the ground, and by dawn there was \"no fog in Hollowmere at all, and no Hollowmere either.\" The barrels are still stacked at the cove.", "facts": ["Road rules: never drive at night, never sleep on green clay, never cut across the upland rings, always leave the last herring in the barrel", "Nobody knows who the woman in grey who visited Hollowmere was", "Other fallen places named in the books include Seven Wells, Brannock Ford and Hearthwell Rest"]}, {"id": "waystones", "name": "Waystone Rings and Singing Stones", "tagline": "Instruments, not temples.", "body": "Up on the uplands stand rings of tuned Aurenn stones. They were never temples. The Wayfinders built them to carry the star's song inland and measure it. After the Drowning, survivors hacked the old writing off each centre stone and cut one crooked line in its place: THE STAR SLEEPS UNDER THE WATER. Elsewhere, black-glass craters lined with violet crystal mark where pieces of the star struck the land. Their crystal rings in the wind, nothing grows on them, and birds fly around them. A chip of singing stone nailed over a door is still said to be \"for the weather\".", "facts": ["Headland rhyme: \"when the stone won't sing, listen for the other thing\"", "Wheat lies flat in the same ring every year on green-clay farms", "Survey camps of the Order of the Alembic still stand near some rings and lens towers"]}, {"id": "under-halls", "name": "The Under-Halls", "tagline": "The biggest roof there is.", "body": "The mist never goes under a roof, and a mountain is the biggest roof of all. The Deepkin closed their mine-holds at dusk on the first night and have never lost a soul to the mist. Twice a year they send ore and star iron down to the coast and ask for lamp oil and fish in return. Together with the Wayfarers' lamp-caravans, they are the only other people in the Reach known to have held on.", "facts": ["Deepkin children learn \"Give the stone its due\" and \"Do not dig where the clay is green\"", "Their teaching chant goes: \"Where is the clay green? Not here!\""]}], "history": [{"era": "Before people", "title": "The Fall", "body": "A star fell into the world and came down where the sea now lies off Moonharbor. It burrowed deep and did not die. It sang. Stone grew veins of star iron, water began to glow and beasts changed. Where its pieces struck the land they left black-glass craters lined with violet crystal that rings in the wind. Long afterwards, the Aurenn named it Oruth, the Singing Star."}, {"era": "The Age of the Aurenn", "title": "The Brass City", "body": "The Aurenn were star-readers who built Aurenhal in brass, glass and tide. They treated the star as a well and drew its song for clockwork that never stopped and lamps that never dimmed. Three offices ran the city. Lens-keepers watched the star, Engine-wardens counted every tide what the wheels drank, and Wayfinders kept the waystone rings. Their hymn promised \"we take only the overflow\"."}, {"era": "The last years of Aurenhal", "title": "The Turn and the Five Exiles", "body": "The city grew comfortable. It built a Second Wheel, quietly changed what \"overflow\" meant, and stopped challenging the counts. Five people tried to warn it: a Lens-keeper, an Engine-warden, a tide-pilot, a glasswright and a fourteen-year-old runner named Vell. The Court of the Balance weighed each one and gave them to the star at low tide. Vell's last words were \"Then I will ask it myself.\""}, {"era": "The end of the Aurenn", "title": "The Three Loud Nights and the Drowning", "body": "For three nights the city's lamps would not dim, children hummed one note in their sleep, waystones rang a day's walk away and cattle stood in the surf facing out. The lens shutters went soft and would not close. The sea drew back past the harbour mouth and lay there breathing. The Great Wheel stopped. The Bellkeeper rang the last bell with his fists, and then the sea came in."}, {"era": "After the Drowning", "title": "The Remnant", "body": "The survivors, mostly Wayfinders and young runners caught out on the roads, sealed the gate and scattered. They kept no names, only what people had done. They cut a warning onto the waystones and a five-line Charge beneath it. They swore never to build a lamp that could not be put out. Their quick, simple runes became Lyrin, the handwriting of the drowned."}, {"era": "The two foundings", "title": "The Stair-folk and Ysara's Landing", "body": "The Remnant's runners returned to the shore above the drowned city, cut the harbour stair from the old Concourse steps and kept watch as the Stair-folk. Generations later, Ysara's elves came over the sea in white-sailed ships. The Stair-folk showed them what slept under the bay. Ysara sank her post on their stair, set the first lamp on it, and made the Moon Pact with Ysolde."}, {"era": "The Age of Silence", "title": "Centuries of half-remembering", "body": "Fishing villages grew along the coast, and the herring road carried salt fish inland. Ilwen the Quiet raised the lighthouse. People forgot what the old warnings meant but kept the habits: chips of singing stone over doors, \"fresh water, never the sleeve\" when wiping glass, and a lullaby made on purpose on the first morning after the Drowning, because a song is harder to drown than a city."}, {"era": "The years before the Night", "title": "The Order of the Alembic", "body": "Magister Oriel Vane found Aurenn ruins beneath the Observatory and worked out six true Workings from them. They made his Order rich and respected. The seventh needed seven vessels, \"one note of the song each\". The queen forbade it. Maren Thornwick refused to brew for it and walked out, and Wenna Penhallow left the same week with her Register. Vane went ahead anyway."}, {"era": "About 80 years ago", "title": "The Unbottled Night", "body": "At the new moon, with every lamp put out, seven people gathered at the Observatory to perform the Seventh Working. It failed. The song escaped as the mist, and the seven were pulled down to become the Hollow Choir. Fog rolled up the valleys against the wind. Creatures came out of the bay, and Syrena held the seawall stair alone until dawn. Queen Maelis carried the moon window's lamp into the mist and never returned."}, {"era": "The first decade of the mist", "title": "The Snuffing", "body": "Only real light holds the mist back. Inland villages burned their candles, then their furniture, then their thatch. Each time a village's last lamp went out, the Wardens marked a small black circle in their ledgers, and there are 194 of them. Most people walked to the coast in daylight. Moonharbor lit by rule, bought lanterneel oil with the Lantern Fund, and took in everyone who came."}, {"era": "The long watch", "title": "Lamps, Ledgers and Legends", "body": "Lamplighters walked their rounds every night. The Ashen Ledger began recovering the names of the drowned. Wenna Penhallow bought back the Order's lost finds, and her house became the museum. Syrena struck a treaty with Old Gnash, lured a corsair fleet onto the Teeth, and lost a Moonlore game to the Pale Pedlar. Thirty years ago her love, Corin Ashby, sailed south and never came back."}, {"era": "Now", "title": "The Lamp Charter", "body": "The lamplighter Tobin Marsh has vanished on the North Road. The Delvers' Gate is waking, and the sky over the bay is slowly going dark. Syrena, the Lamp-Heir, has issued the Lamp Charter: anyone who keeps a lamp burning may hold land in the Reach. It is the first time in eighty years Moonharbor has asked people to go out instead of in. That means you."}], "figures": [{"id": "ysolde", "name": "Ysolde, the Sleeping Moon", "role": "The moon who dreams the world", "body": "Everyone in Lyris agrees that Ysolde dreams the world, and that while she sleeps, things hold. Every star in the sky is something she remembers, which is why the constellations tell Lyris's own history. She dreams beneath the swell of Moonharbor's bay, and under the Moon Pact she keeps the star's song asleep with her. The Moonwake teach that sleep is a prayer and dreams are her way of speaking. Their first rule is simple: do not wake the Moon."}, {"id": "oruth", "name": "Oruth, the Singing Star", "role": "The fallen star beneath the sea", "body": "Oruth fell from the southern sky, where a starless patch called the Hollow still marks the place it once hung. It came down off Moonharbor and has been singing ever since. The Aurenn drew power from its song until it drowned them, and the mist is that same song escaped into the open air. Oruth sheltered the people the Aurenn cast out to it. Some say it is only a well, others that it is someone. Vane, who heard it once, said it sounded \"interested\"."}, {"id": "ysara", "name": "Ysara the Lantern-Crowned", "role": "First elven queen of Moonharbor", "body": "Ysara led the Moonlit elves over the sea in white-sailed ships and found the bay with Ysolde dreaming beneath it. The Stair-folk told her what slept below. She built the hall and quay of oak and stone, sank a post on the harbour stair as the town's anchor, and set the first lamp on it. The Lantern Covenant grew from that lamp. Ysolde lifted its light into the sky to become the Lantern, the pole star every sailor steers by. Ysara made the Moon Pact."}, {"id": "ilwen", "name": "Ilwen the Quiet", "role": "Queen of the Moonlit line, lighthouse builder", "body": "Ilwen raised the lighthouse tower on the point with her own mason's square. People call it Ysara's first lamp grown tall. Since the ships stopped coming from the Old Shore, it has been the only fixed light on the whole coast, and every ship still sailing the Reach steers by it."}, {"id": "maelis", "name": "Queen Maelis", "role": "The lost queen", "body": "Maelis forbade Vane's Seventh Working. When the mist rose anyway, she took the moon window's lamp and walked into it to bargain, and she never came home. Her name \"will not take the ink\" in the Ashen Ledger. Every faith argues about her. The Covenant call her a martyr, the Moonwake say she broke the Pact by leaving the window, and the Veiled whisper of a crowned woman who walks the mist with an unlit lamp. Every Night of Lamps, one lantern is left burning for her."}, {"id": "syrena", "name": "Syrena of the Moon Window", "role": "The Lamp-Heir, uncrowned", "body": "Syrena is Maelis's daughter, an elf about a century old. She wears a wide witch's hat where her crown should be and carries Ysolde's Thorn, a star-iron greatsword longer than she is tall. She held the seawall alone on the first mist night, and she will not be crowned until her mother returns. She works star-witchery and sea-witchery, swims to the Teeth at dawn, is nearly unbeatable at Moonlore and makes terrible seaweed scones. She has written thousands of letters to her mother and never sent one. She issued the Lamp Charter."}, {"id": "corin", "name": "Corin Ashby", "role": "Star-chart maker, lost at sea", "body": "Corin was a freckled, laughing human chartmaker with ink on her fingers. Thirty years ago she sailed south on the Saltwren to chart the constellations you can only see from the far south, and promised to name the brightest after Syrena. She never came back. Her one-eyed raven, Raven, came home alone in the spring and still says Syrena's name in Corin's voice. Every night since, a false star has hung over the bay so she can steer home by it. The fishers say the real stars are slowly going out."}, {"id": "vane", "name": "Magister Oriel Vane", "role": "Founder of the Order of the Alembic", "body": "Vane found an Aurenn stair hidden beneath a stair and learned six true Workings from its upper turns. Together they made his Order famous. The seventh lay at the bottom. When the Queen wrote \"You shall not do this,\" he sent the letter back with \"Then what are stars for?\" in the margin. On the night before the Night, something at the bottom of the stair spoke to him. He never said what it told him. He now kneels at the centre of the Hollow Choir, and his star-glass heart is the only one that is cracked."}, {"id": "wenlock", "name": "Wenlock Pryde", "role": "Clockmaker, the Escapement", "body": "Wenlock was a small, neat man with a jeweller's loupe pushed into his hair. He mended the stopped Town Hall clock after nine nights in the tower and built the harbour's first sea-clocks. They drift a breath a day, and captains still call that \"a Pryde's breath\". Vane showed him a gear tooth from an Aurenn machine, and Wenlock answered: \"It is not turning. It is being turned.\" On the Unbottled Night he turned a wheel the old warnings said never to turn. He was last heard counting in the dark, getting faster."}, {"id": "maren", "name": "Maren Thornwick", "role": "The alchemist who walked out", "body": "Maren was asked to brew a draught that would let seven people hear the star's song without going mad. She read the recipe and refused: \"whatever hears that song should be able to run from it.\" She left the Order that week and left her mortar on the bench. Her Green Ledger of herbcraft survives in scattered pages, and her herb garden still grows in town."}, {"id": "wenna", "name": "Wenna Penhallow", "role": "Scholar, founder of the museum", "body": "Wenna left the Order the same week as Maren and took her Register with her. In the survey trenches she knelt for an hour over a band of blue-grey silt and said, \"One night. All of this in one night.\" After the mist came she bought the Order's lost finds back from smugglers, and her house became the museum. She wrote dry notes in the margins of everything. When Vane called the old runes debased, she answered: \"a script that survived the end of the world is not debased. It is the thing that won.\""}, {"id": "edric", "name": "Keeper Edric Penhallow", "role": "Keeper of the Museum", "body": "Edric is Wenna's nephew and keeps the museum today. He wrote Why the Land Is Empty for new charter-holders, and he recorded the account of Pell Ostry, who saw Syrena on the seawall when she was eight. If you are stuck on an old Order page, bring it to him. For a fee he may find his aunt's margin note on it."}, {"id": "vell", "name": "Vell", "role": "Aurenn runner, the last exile", "body": "Vell was a fourteen-year-old runner of the Wayfinders' house. She carried letters between the upland rings, hidden in her boots, warning that the wheels were drinking too deep. She would not name who wrote them. When the court weighed her, she said, \"Then I will ask it myself.\" A line scratched under her record reads: \"She asked. It answered. Three tides later the sea came in.\" Nobody knows what she asked for."}, {"id": "tobin", "name": "Tobin Marsh", "role": "The missing lamplighter", "body": "Tobin was one of Moonharbor's lamplighters, and he walked the North Road alone. One night he did not come back. The Crier ran the headline \"Lantern found burning, no trace of its keeper.\" Chalk at an old sealed door reads \"T.M. was here. It hummed.\" Beside the Delvers' Gate his name sits in the Delvers' Roll with no cross after it, because the lamp is still lit."}, {"id": "pale-pedlar", "name": "The Pale Pedlar", "role": "A trader nobody understands", "body": "The Pale Pedlar turns up in random rooms of the Hollowdeep and trades rare things for lore pages and Codex writings, never for coin. Nobody knows what he is. Syrena once lost a game of Moonlore to him and paid with her reflection. When she asked where her mother was, he said only: \"She is closer than the water.\""}, {"id": "old-gnash", "name": "Old Gnash", "role": "Guardian of the bay", "body": "Old Gnash is a sea turtle the size of a chapel. Seventy years ago Syrena struck a treaty with him: he guards the bay, and every New Year he gets a barrel of salt herring. Moonharbor marks the day as Gnash Day."}, {"id": "pale-stag", "name": "The Pale Stag", "role": "Creature of the mist's edge", "body": "A pale stag walks at the edge of the wilds. The Old Hunt say never shoot it. The Veiled say it leads the lost home. The lamplighters say it was on the North Road the night Tobin went missing. A calcite statue of it stands on a mossy rock, looking back toward town."}, {"id": "hoarfeather", "name": "Hoarfeather", "role": "Owl keeper of the Observatory", "body": "Hoarfeather is an owl wizard who keeps the Observatory and runs the Owl Post. New arrivals can find him at his perch near the Observatory. He admits that some of the letters that arrive with no sender are from him."}], "factions": [{"id": "lantern-covenant", "name": "The Lantern Covenant", "body": "\"Every lit lamp is a promise kept.\" This faith grew from Ysara's first harbour lamp, and its members keep a light for whoever walks behind them, shelter strangers and let no lamp go out on their watch. Their home is the Chapel of Lamps near the lighthouse, where the Lamp Tree hangs over the altar. Every full moon is the Night of Lamps, and one lantern is always left burning for Queen Maelis. To them she is a martyr."}, {"id": "moonwake", "name": "The Moonwake", "body": "\"She sleeps, and so the world is.\" This is the royal faith of the Moonlit line. Its followers believe the world is Ysolde's dream, so sleep is prayer and dreams are her speech. They keep the moon window lit, record what the sky shows and never sleep through a full moon. They hold Vigils at the Temple of the Sleeping Moon near the Observatory, where Ysolde lies carved asleep in a reflecting pool. Syrena, the Lamp-Heir, is their patron."}, {"id": "tide-mother", "name": "The Tide Mother", "body": "\"What the sea gives, give a share back.\" This is the fishers' faith. The first fish of the day goes back, no sailor is left to drown and nobody takes more than they need. Their driftwood shrine stands under whale-rib arches at the end of Lantern Pier. Their Tidewives read the swell and sing the old tally-counts that tell whether the sea is giving or taking. Of Maelis they say: \"The sea took the lamp and gave back the mist. A bad trade, but a trade.\""}, {"id": "green-hearth", "name": "The Green Hearth", "body": "\"No one eats alone at the Hearth.\" Followers sow in season, share the table and waste no harvest. Their custom of a chair for the stranger goes back to an old herring-road rule: always leave the last herring in the barrel. In the first mist decade it became Moonharbor law. They gather at a timber pavilion by the Greenhouse with a hearth-altar between long harvest tables."}, {"id": "old-hunt", "name": "The Old Hunt", "body": "\"Take what you need. The Antlered One counts the rest.\" Their rules are a clean kill, no waste, never the young, and never the Pale Stag. Seven mossy standing stones ring their antler shrine out by the wilds. Their masked Antler-Bearer speaks only on First Frost."}, {"id": "deepkin", "name": "The Deepkin Creed", "body": "\"The Earth sleeps. Walk softly on its bones.\" These are the miners and the people of the Under-Halls. They carry a lamp below, take the ore, leave the bones, and give the stone its due. Every Deepkin child learns never to dig where the clay is green. Their deep chapel lies under the Miners' Guild, ribbed with ore veins and set with a fossil spine in the floor."}, {"id": "wayfarers", "name": "The Wayfarers", "body": "\"Every road is a prayer. Walk it to the end.\" Their lamp-caravans travel by day and ring their wagons around a single great lantern at dusk, so they never need a wall. Their rule, \"add a stone, take one story,\" is how news crosses the Reach. They finish what they carry, help the stranded and raise cairns along the roads. They also keep a fallen lamp post lit on the Old Coast Road."}, {"id": "bright-cask", "name": "The Bright Cask", "body": "\"Pour one for the road, and one for whoever walks it.\" This is the tavern faith. Its followers share the first drink, tell the story true-ish and let no grudge outlive a toast. Their giant cask shrine sits by the Moonlore Tavern, and every Friday is Cask Night. They are friendly with every faith except one, and they toast Maelis \"wherever she walks\"."}, {"id": "ashen-ledger", "name": "The Ashen Ledger", "body": "\"Every name is written. Every debt is paid.\" After the Night they began recovering the names of the drowned from songs and net-marks. They pay their debts, return what the dead leave behind and want justice by law, not by the blade. Their graveyard chapel keeps the Book of Names. Some names will not take the ink, and that troubles them deeply."}, {"id": "veiled", "name": "The Veiled", "body": "\"Walk unlit and be remembered.\" This is a secret faith. Its followers say the mist is not a curse but a memory, and they carry no light they do not need. Their shrine is hidden deep in the wilds with no path to it, and their motto turns up carved in runes in unexpected places. They whisper of a crowned woman who walks the mist. They are rivals of the Covenant and the Ledger."}, {"id": "hollow-star", "name": "The Hollow Star", "body": "\"It fell so that we might sing.\" This faith is forbidden. Its tenets are to go where you should not, give the star what the earth hides, and sing back. It descends from the Aurenn Listeners, who believed the star was someone and the city should answer it. They count Vell as their first saint. Every other faith stands against them. Their power is real, and so is its cost."}, {"id": "order-of-the-alembic", "name": "The Order of the Alembic", "body": "This was Magister Oriel Vane's order of alchemists, based at the Observatory and its chapterhouse. It grew rich and respected on six true Workings drawn from Aurenn ruins. Then the Seventh Working broke on the Unbottled Night and the Order scattered. Its notebooks were torn into leaves and hidden in ruins, wrecks and caves. Some leaves are partly written in Lyrin. Seven empty plinths in the Hall of Alembics still wait for its Great Works to be claimed."}, {"id": "aurenn", "name": "The Aurenn", "body": "The Aurenn were the star-reading people of drowned Aurenhal. They built in brass, glass and tide, counted time in tides, and drew on Oruth's song with care, until they stopped being careful. They condemned the people who warned them, and after the Three Loud Nights the sea took the city. Their Brass Wardens still guard their doors below, and their tide-marks and name tags still turn up in ruins: brass for the loved, bronze for the weighed."}, {"id": "remnant", "name": "The Remnant and the Stair-folk", "body": "These were the few who survived the Drowning, mostly Wayfinders and runners caught out on the roads. They recut the waystones with a warning and the Charge, and they swore never to build a lamp that could not be put out. Their quick runes became Lyrin. Their runners settled the shore above the drowned city as the Stair-folk, and Moonharbor's oldest families descend from them."}, {"id": "lamplighters", "name": "The Lamplighters", "body": "Moonharbor's lamplighters began in the first mist winter as Wardens' men with poles, paid from the Lantern Fund. Their six rules: walk in pairs, light from the town outward, carry oil for every post and one more, mark a lamp that won't light and go home, never answer voices (not even your own name), and be back by midnight. When a lamp blows out on its own, they relight it and mutter \"Not tonight, Kell.\""}], "choir": [{"seat": "I", "name": "Magister Oriel Vane, the Conductor", "note": "Void", "song": "Queens Forbid", "line": "He wrote \"Then what are stars for?\" in the margin of a queen's letter, and now he holds the silver thread that binds all seven notes."}, {"seat": "II", "name": "Sister Aurelle Wick, the Lens", "note": "Light", "song": "Never the Sleeve", "line": "One frozen dusk she wiped the great lens with her sleeve, the star looked back, and she gave it her eyes."}, {"seat": "III", "name": "Hesper Rook, the Draught", "note": "Life", "song": "The Draught", "line": "The harbour's most loved healer brewed the draught Maren refused to make and poured seven little cups."}, {"seat": "IV", "name": "Callum Ord, the Digger", "note": "Stone", "song": "Green Clay", "line": "A Deepkin miner who dug where the clay was green, hauled up a hundred crates of crater glass, and heard the singing below."}, {"seat": "V", "name": "Idris Kell, the Kiln", "note": "Heat", "song": "No Lamps", "line": "Fired the crystal, sealed the vessels, then went wick to wick pinching out every flame so the star could see the dark."}, {"seat": "VI", "name": "Wenlock Pryde, the Escapement", "note": "Motion", "song": "Turn the Wheel", "line": "The clockmaker who turned the wheel the Remnant warned against and gave the song a beat, still counting in the dark."}, {"seat": "VII", "name": "Merrin Saltash, the Undertow", "note": "Tide", "song": "The Undertow", "line": "The Tidewife who read the last old count as \"turned\", left the Tide Mother, and set the seven notes in order."}], "sources": ["claude/Lyris world chronicle.md", "claude/Lyris the Aurenn - lore.md", "claude/Lyris why Moonharbor stands - lore.md", "claude/Lyris Syrena lore.md", "claude/Lyris Hollow Choir - the seven and their songs.md", "claude/Lyris Hollow Choir - lore of the songs.md", "claude/Lyris Wenlock Pryde - lore.md", "claude/Lyris Oruth the Singing Star reference.md", "claude/Lyris Hung Star reference.md", "claude/Lyris faiths LyrisFaith 1.0 reference.md", "claude/Lyris faiths reference.md", "claude/Lyris Great Works - the lost folios.md", "claude/Lyris stargazing reference.md", "claude/Lyris Hollowdeep dungeon reference.md", "claude/Lyris Hollowdeep draft 3 - the ancient world and build design.md", "claude/Lyris Delvers' Gate build reference.md", "claude/Lyris Moonharbor city build reference.md", "claude/Lyris lamplighter reference.md"]}, "systems": {"categories": [{"id": "crafting", "name": "Crafts and trades", "blurb": "Cook, brew, mix, heal, forge and bind your way to a name in Moonharbor."}, {"id": "sea", "name": "The sea and the road", "blurb": "Fish the rivers, sail the fleet and haul trade goods between ports."}, {"id": "night", "name": "Night and mist", "blurb": "When the mist rolls in, your lantern is everything."}, {"id": "deep", "name": "Exploration and the deep", "blurb": "Dig, pan, decode and delve into what the Aurenn left behind."}, {"id": "land", "name": "The living land", "blurb": "Crops, seasons, strange trees and the wild things that roam them."}, {"id": "town", "name": "Economy and town life", "blurb": "Coins, shops, claims, ranks and the games people play in town."}, {"id": "sky", "name": "Faith and the sky", "blurb": "Read the stars, find your way home and choose what you believe."}], "systems": [{"id": "fishing", "category": "sea", "name": "Fishing", "tagline": "Four Lyris minigames between you and every bite.", "status": "live", "summary": "Fishing in Lyris is more than waiting for a bobber. When a fish bites you play a short minigame, and which one depends on where you cast. Rivers and lakes bring Moonbite and Shadow Line, oceans bring Tidebeat, and the rare golden-star fish fight back in Bow to the King. The classic timing bars are still there too, redrawn with brass rails, a red-capped float and a silver moon carp. Fish feed cooking and alchemy, and they sell at the Fishmonger's stall on Lantern Pier.", "steps": ["Cast into a river, lake or the sea with any rod.", "When the minigame starts, read the action bar hint at the bottom of the screen.", "Moonbite: right-click only when the float plunges under with a splash, never on a nibble.", "Shadow Line: turn your head left and right to keep the float over the fish's shadow.", "Tidebeat: right-click as each wave crest reaches the lantern post. Gold moon crests count double.", "Sell your catch at the Fishmonger's stall or take it home to cook."], "commands": [], "tips": ["In Bow to the King, rings on the water warn of a leap. Sneak to bow the rod, and don't reel during the leap.", "Left click is never used in any fishing game, so stick to right-click.", "Striking early in Moonbite spooks the fish. Three spooks and it's gone.", "The fish market has a daily earnings cap, so spread your selling out."], "source": "claude/Lyris fishing games reference.md"}, {"id": "cooking", "category": "crafting", "name": "Cooking", "tagline": "Put food on the hearth, play the pan, eat like royalty.", "status": "live", "summary": "The Kitchen Hearth turns whatever you grew, caught or hunted into named dishes with stars, doneness, an optional spice accent and real buffs. Recipes ask for kinds of food, not exact items, so meat, two vegetables and a liquid make a stew, whether that's Venison Stew or Salmon Stew. Each method has its own quick minigame, and the hearth always shows what you are about to make before you cook. Nothing is wasted: a failed mix becomes an edible Mystery Hash.", "steps": ["Right-click a Kitchen Hearth and click up to six foods from your pack onto it.", "Optionally right-click a spice into the 7th slot to add an accent, like Fiery or Moonlit.", "Pick a method: Prep, Fry, Simmer, Bake or Roast. The preview shows the dish and hints if you're close to something.", "Click Cook and play the minigame (8 to 15 seconds).", "Eat the dish for buffs, sell it at the Kitchen Hatch, or use it in another recipe."], "commands": ["/cook - open your Cookbook with hints for undiscovered dishes"], "tips": ["Any dish you've made at 2 stars can be shift-cooked at 2 stars with no minigame.", "Better ingredients (golden-star crops, 3-star meat) raise your dish's stars.", "You keep two meals' buffs at once, and a dish you haven't eaten recently lasts longer.", "Rank up from Scullion to unlock Bake and Roast, then the Smokehouse and Preserving Crock."], "source": "claude/Lyris cooking reference.md"}, {"id": "dine", "category": "crafting", "name": "Sit-down dining", "tagline": "Set the table, pick up a spoon, take three bites.", "status": "live", "summary": "Cooked dishes are real 3D food now, in your hand, on the ground and on the table. Hearty dishes like stews, pies and roasts are sit-down meals: you set them on a table and eat them with the right utensil, watching it dip into the bowl and lift to your mouth. Three bites finish the meal and give you its full effects. Sandwiches, skewers, loaves and other hand foods are still eaten the normal way.", "steps": ["Craft a spoon, fork or knife from iron nuggets and a stick.", "Right-click the top of a block with a sit-down dish to set it down.", "Hold the right utensil (the dish's tooltip tells you which) and right-click the dish.", "Take three bites to finish it. Bowl dishes give you the bowl back."], "commands": [], "tips": ["Soups and stews want a spoon, salads and pies a fork, roasts a knife.", "Walk more than 4 blocks away and the meal pauses. Your progress is kept.", "Sneak with an empty hand to pick your dish back up."], "source": "claude/Lyris LyrisDine 3D dishes reference.md"}, {"id": "tavern", "category": "crafting", "name": "The Moonlore Tavern", "tagline": "Distil spirits, work the bar and raise a glass with friends.", "status": "in progress", "summary": "At the Moonlore Tavern, brewers make the stock and bartenders serve it. At the Still you fire the pot and make clean cuts to bottle spirits. Behind the bar you pour to the gold line, shake and stir on the beat, garnish and even flip a bottle or light a flambé for bigger tips. Work a shift as patrons pin their tickets, or fill real orders from other players. Every drink is a real 3D glass you can set on a table and clink with friends.", "steps": ["Open the Still, pick a spirit and hold the fire in the green band.", "Watch the sight glass and switch jars as the run moves from heads to hearts to tails.", "At the Bar, click a drink to mix it yourself, or choose Work a shift.", "Pour each part to the gold line, shake or stir on the green, add ice and garnish, then Serve.", "Sneak with a drink in hand near a friend who did the same to clink glasses."], "commands": ["/tavern order <drink> - pay up front and have a bartender mix it for you"], "tips": ["Rush hour brings faster patrons and better tips.", "A flair move (bottle flip or flambé) adds 25% to the tip.", "Ranks go Barback, Bartender, Head Barkeep, Tavern Legend. Each unlocks new drinks.", "Sneak and right-click a table with a drink to set it down. Watch out, anyone can swipe it."], "source": "claude/Lyris tavern reference.md"}, {"id": "alchemy", "category": "crafting", "name": "Alchemy", "tagline": "Every ingredient hides an essence. Find out what it does.", "status": "live", "summary": "Alchemy is the art of transformation, carried on from Magister Vane's Order of the Alembic. Every ingredient carries hidden amounts of seven properties: Light, Life, Stone, Heat, Void, Motion and Tide. You grind, burn, cook, dissolve, steep, distil, freeze, smack and combine them to make reagents, and how the properties meet decides what you get. Neighbours on the Alembic Wheel bond and opposites clash. Over a hundred Wonders are waiting to be found, from smoke pellets to sparkle dust.", "steps": ["Open an alchemy lab and place your ingredients in the tray.", "Pick a method. The lab switches to its apparatus: Mortar, Athanor, Cauldron, Alembic, Frost Coffer, Striking Block or Crucible.", "Play the apparatus minigame. A better score gives more yield and less unstable Force.", "Watch what the reaction reveals and note which properties took part.", "Combine reagents in the Crucible, venting any clashes, and aim for Pure or Perfect grade."], "commands": [], "tips": ["Bonded pairs like Light and Tide, or Heat and Void, are stable and safe to combine.", "Clashes such as Heat and Tide release Force. Vent them to strip out properties you don't want.", "Labs open to the sky are stronger, and the moon, season and weather all nudge results.", "The seven Great Works and the Hall of Alembics are coming in a later chapter."], "source": "claude/Lyris alchemy reference.md"}, {"id": "apothecary", "category": "crafting", "name": "The apothecary", "tagline": "Gentle remedies for mild ailments, in the tradition of Maren Thornwick.", "status": "planned", "summary": "Where alchemy transforms, the apothecary heals. Life in Lyris can leave you with small ailments like Mist Chill, a Sprain, Burns or Seasick. Each is mild, warned about first, and wears off by itself. Apothecaries grow and dry herbs, steep teas, stir salves and stitch bandages to cure them faster and add a small tonic bonus. A planned infirmary at Thornwick's Apothecary sends townsfolk with symptoms to diagnose and treat for pay.", "steps": ["Talk to Thornwick's apprentice to start as a Herb-Gatherer.", "Grow herbs like Mint, Ginger, Yarrow and Chamomile, and smell and taste them at the Herb Bench to learn their virtues.", "Dry, grind and steep them into teas and lozenges.", "Cure yourself or right-click another player with a remedy to treat them."], "commands": ["/ailments - your Physician's Chart (planned)"], "tips": ["No new ailments in your first 3 hours, inside Moonharbor or in your own claim.", "A remedy given to someone else counts one star higher.", "The four apothecary herbs are already live as crops you can grow today.", "Thornwick's counter will always sell basic cures, so nobody gets stuck."], "source": "claude/Lyris apothecary reference.md"}, {"id": "forging", "category": "crafting", "name": "Forging", "tagline": "Diamond gear is gone. Smiths make what comes after iron.", "status": "planned", "summary": "In Lyris, vanilla diamond and netherite recipes are already switched off. Gear past iron will come from the forge, through a chain of six minigames: smelt, heat, hammer, quench, temper and finish. How well you play sets the grade, from Crude to Masterwork, and a rare few reach Legendary. Every piece carries its smith's maker's mark, and the tiers climb from Harborsteel through Star Iron, Moonsilver and Runeplate to Aurenn Alloy and Starforged.", "steps": ["Learn a blueprint at the Smiths' Hall, starting with Forged Iron.", "Smelt and alloy ore at the Crucible, then heat the billet to the right colour.", "Hammer it on the Anvil, striking as the ring meets the mark.", "Quench it in a liquid of your choice. Each liquid gives a different trait.", "Temper, then finish with a grip, an optional inlay and your maker's mark."], "commands": [], "tips": ["A blueprint you've forged at Fine or better can be auto-forged at Common grade.", "Legendary pieces need a near-flawless run under a full or new moon.", "Old wrecks and fragments hide recipes nobody will teach you."], "source": "claude/Lyris forging reference.md"}, {"id": "books", "category": "crafting", "name": "Bookbinding and the library", "tagline": "Write it, bind it, print it, and watch for forgeries.", "status": "in progress", "summary": "Write a book in a normal book and quill, then make it something to keep. At the Bookbinder's Bench you choose a cover and colour and stitch the binding for up to three stars. The Printing Press makes copies, signed first editions and numbered runs. The Scribe's Desk lets you hand-copy pages in a word-order minigame. Collectible books can be forged, and an Appraiser's Loupe catches fakes. The Grand Library, bookshelves, lending and author royalties come next.", "steps": ["Write and sign a book.", "At the Bookbinder's Bench, pick a cover material and colour and press Bind.", "Play the stitching minigame. 3 stars gives gilt edges.", "Print copies or a signed first edition at the Printing Press.", "To check a rare book, hold the Appraiser's Loupe in one hand and the book in the other and right-click."], "commands": ["/books info - see the held book's edition and history", "/books rights add <player> - let someone print your book", "/books rights remove <player> - take printing rights back"], "tips": ["Copies are records, so a book can never be duplicated.", "Selling a fake as genuine is meant to become a crime detectives can solve.", "A forger can honestly mark their own work as a Replica."], "source": "claude/Lyris books build reference.md"}, {"id": "furniture", "category": "crafting", "name": "Furniture making", "tagline": "Craft cozy sets at your own stations, and rest well among them.", "status": "in progress", "summary": "Lyris furniture comes in themed sets (Driftwood, Moonharbor and Nightbloom) that you craft yourself at four stations: the Sawhorse, Joiner's Bench, Weaver's Loom and Tinker's Anvil. Learn a blueprint, make the parts with tools that wear and can be repaired, then assemble seats, beds, lamps that flicker, storage and more. A cozy home earns Comfort, and sleeping or sitting in comfort gives you the Rested buff.", "steps": ["Start with the Driftwood blueprints, which are free on your first join.", "Craft your stations and tools.", "Turn raw materials, including Driftwood Logs from ocean fishing and Flax for linen, into parts.", "Assemble the piece and place it at home."], "commands": [], "tips": ["Rested cuts hunger drain by a third.", "Better tools need a hammer one tier below them to make.", "More blueprints can be bought at the Blueprint Stall."], "source": "claude/Lyris furniture system build reference.md"}, {"id": "ships", "category": "sea", "name": "Ships and the Shipwright's Yard", "tagline": "Build your own ship from keel to sail, then take the helm.", "status": "live", "summary": "Eight ships sail the seas of Lyris, from the tiny Moonskiff with its crescent-moon sail to the Dragon Galleon and the Royal Caravel. You build them at the Shipwright's Yard through a full recipe tree: season timber at a campfire, forge Shipwright's Iron, cut nails and scrollwork, then craft hull parts at the Carpenter's Bench and sails at the Sail Loft. Finally you launch the ship from the Slipway. Your plank and wool choices set the hull wood and sail colour.", "steps": ["Make a ship blueprint at a crafting table (paper, ink, maps, a compass and a theme item).", "Prepare raw stock: Seasoned Timber, Pine Pitch, Oakum, Sailcloth, Shipwright's Iron and nails.", "Open the Carpenter's Bench or Sail Loft, pick a plan and click the tool once per strike.", "Bring the finished parts to the Shipwright's Slipway and launch your ship.", "Sit in the helm chair: W and S change speed, A and D turn."], "commands": [], "tips": ["Parts are only used up on the final strike.", "Trader ships like the Thistledown Trader and the Dwarven Ironclad hold 4 cargo crates.", "Use a Refit Kit near a launched ship to repaint its hull and sails.", "Attack the mast to pack the ship back into an item."], "source": "claude/Lyris fleet ships reference.md"}, {"id": "carriages", "category": "sea", "name": "Carriages, carts and wagons", "tagline": "Hitch your horses and take the road.", "status": "live", "summary": "For travel on land there are five vehicles: the Hay Cart, the Royal Carriage for passengers, the four-horse Covered Wagon for freight, a Market Pushcart you push yourself and a Rickshaw you pull. Build them from wheels, axles, beds and harnesses at the Wainwright's Bench or the shipwright stations, then hitch tamed horses, donkeys or mules and drive. Carts carry cargo crates, which makes them the backbone of overland trade.", "steps": ["Craft a Wainwright's Bench and make stock like Seasoned Planks, Cart Nails and Leather Straps.", "Turn stock into parts: Spoked Wheels, Axle and Springs, a Cart Bed, Shafts and a Harness.", "Assemble the vehicle on its blueprint, one strike per part type.", "Place it, lead tamed horses to it and right-click to hitch every slot.", "Sit in the front seat: W and S for speed, A and D to steer, sneak to get off."], "commands": [], "tips": ["Pushcart and Rickshaw: right-click the handlebar or shafts to grab them, again to let go.", "Each crate on a horse vehicle costs a little top speed.", "Owners sneak and right-click to unhitch, then again to pick the vehicle up."], "source": "claude/Lyris carriages reference.md"}, {"id": "cargo", "category": "sea", "name": "Cargo crates and trade depots", "tagline": "Buy low at one port, deliver to another, and grow both.", "status": "live", "summary": "Depots are trading posts that players open by placing a depot stand. Every 20 real hours each depot rolls new goods it sells and goods it wants. Buy a crate, pick a destination and carry it there by hand, cart or ship hold, and you're paid more the farther it travels and the more the port wants it. Crates are heavy and slow you down, so the real game is planning a route. Every delivery helps ports grow from Landing to Grand Port.", "steps": ["Open a depot's ledger and pick a crate for sale.", "Choose a destination on the sea chart. The tooltip shows pay and profit.", "Carry the crate, or lash it onto a cart or stow it in a ship's hold.", "Follow the yellow compass bar to the destination depot.", "Right-click the destination stand while carrying the crate to deliver it."], "commands": ["/cargo board - open the nearby depot board", "/cargo where - where your crate is going", "/cargo today - your earnings toward today's limit", "/cargo log - your delivery log", "/cargo abandon - give up a crate you're stuck with (confirm within 30 s)", "/cargo rename <name> - rename a depot you own"], "tips": ["While carrying a crate you can't fight, dig, ride or teleport far.", "Demand drops as more crates arrive in a cycle, so spread your routes.", "Past the daily limit a delivery still refunds your crate price, never a loss.", "If you die, the crate is set down where you fell."], "source": "claude/Lyris cargo crates reference.md"}, {"id": "mist-nights", "category": "night", "name": "Mist nights and your lantern", "tagline": "Real dark, real fog, and only real light pushes it back.", "status": "live", "summary": "Nights in Lyris are darker than vanilla, and a slow ground mist rolls over natural land after dusk. Moonlit nights let you see landmarks far off, while new-moon nights are close to pitch black. The only thing that clears the mist is real light: block light of 7 or more, lit town lanterns, or the hand lantern burning lamp oil. Night vision doesn't work outdoors after dark. That's why towns glow, lit roads matter and every traveller carries a lantern.", "steps": ["Buy a hand lantern and lamp oil from the Lamp Seller at the Moonmarket.", "Hold the lantern in either hand at night to light the area around you.", "Keep it fuelled with lamp oil. It goes dark when the oil runs out.", "Travel by lit roads or carry your own light into the wilds."], "commands": [], "tips": ["Mist never forms under roofs, on paved roads or in lit areas.", "The sky stays clear above the mist, so you can always see the stars.", "Held torches don't light your surroundings. Only the hand lantern does.", "Lore says the mist parts for the ill-famed. Draw your own conclusions."], "source": "claude/Lyris mist reference.md"}, {"id": "lamplighter", "category": "night", "name": "Lamplighter", "tagline": "Light the roads at dusk and get paid for keeping travellers safe.", "status": "live", "summary": "Moonharbor has kept lamplighters since the mist first came. Sign on at the Lamplighter's Board, take the satchel and a Lighting Pole, and walk a named road at dusk lighting its road lanterns. Every lit lantern is a real light, so a fully lit route becomes a mist-free corridor for everyone that night. You're paid per lantern, with a bonus for a full route, and at dawn every lantern goes out and the routes reset.", "steps": ["Open the Lamplighter's Board and take the satchel (25 copper deposit, refunded when you hand it back).", "Buy lamp oil on the board and get a Lighting Pole.", "Pick a route and click SET to get a compass to the nearest unlit lantern.", "From dusk, right-click each road lantern with the pole in your main hand.", "Finish the whole route before midnight for the route bonus."], "commands": ["/lamplighter - open the Lamplighter's Board (also /lamps)"], "tips": ["4 copper per lantern, +20 for a full route, and storm nights pay 25% more.", "Each lantern pays once a night, and you can earn up to 150 copper a night.", "Sometimes lighting a lantern uses no oil.", "Lamp-thieves snuff lit lanterns. Keep an eye on your route."], "source": "claude/Lyris lamplighter reference.md"}, {"id": "mist-creatures", "category": "night", "name": "Mist creatures", "tagline": "Strange things walk the deep mist. Some help, some steal.", "status": "live", "summary": "Out in the deep mist, away from towns, claims and lantern light, rare creatures appear. The Pale Stag leads the patient to its velvet. Lamp-thieves creep toward your lantern to drain its oil. Mist Moths circle a burning lantern, Wisp-lures drift ahead like false lights, and the Watcher stands far off, vanishing the moment you look straight at it. Their drops are valuable to alchemists and apothecaries, and every sighting goes in your Mist Bestiary.", "steps": ["Head into the wilds at night, far from town lights and claims.", "Follow a Pale Stag calmly for a minute without sprinting to earn its velvet.", "Hold your lit lantern on a lamp-thief for 2 seconds to burst it.", "Crouch and right-click a Mist Moth with an empty hand to try to catch it.", "Look for faint grey dust: right-click the ground there to dig up a mist cache."], "commands": ["/bestiary - your Mist Bestiary"], "tips": ["Never hit the Pale Stag. It marks you with Stagbane and thieves hunt you all night.", "Spot the Watcher three times to earn the Mistwalker title.", "Ghostcaps grow in the dark and are gone by dawn. Pick them while you can.", "Everything fades at dawn."], "source": "claude/Lyris mist reference.md"}, {"id": "mining", "category": "deep", "name": "Mining and the Wilds", "tagline": "A resetting world of custom ores, geodes and gas caves.", "status": "live", "summary": "Serious mining happens in the Wilds, a resource world reached through the Wilds Gate and reset each season. Deep down you'll find Lyris ores: Star Iron, Moonstone, Runestone, Brimstone, Sea-glass and geodes full of gems. Each ore needs a good enough pick. The deep is dangerous: caves are pitch dark, unsupported tunnels cave in, and some caves are full of gas that ignites at any open flame. Those gas caves also hold the richest ore.", "steps": ["Walk through the Wilds Gate in town to reach the Wilds.", "Bring a lantern, and a Safety Lamp, canary and respirator for gas caves.", "Place Mine Timber every few blocks in wide tunnels.", "Crack geodes at the Cracking Bench and sell ore at the Assay Counter.", "Carry or haul your ore home, since ore can't be teleported."], "commands": [], "tips": ["If the canary goes quiet, there's gas. Never bring a torch or open flame into it.", "Dust trickling from the ceiling means a cave-in is coming.", "Tap a wall with the Prospector's Pick to hear ore nearby.", "Check the Seam Board for this week's rich seams. Ender chests don't work in the Wilds."], "source": "claude/Lyris mining and inventors build v1.md"}, {"id": "panning", "category": "deep", "name": "River panning and sifting", "tagline": "Swirl the pan, chase the gleam, sift for treasures.", "status": "live", "summary": "A gentler way to prospect. Wade into a shallow river with a Prospector's Pan to swirl, wash and pick through the silt for rare minerals, with a chance at a gleam. Each stretch of river holds limited colour that refills slowly, so panners roam. Back home, the Sifting Board shakes gravel, sand, silt, hearth ash and wreck sand, then lets you brush or tweezer cells to lift fragile finds clean. There are 20 minerals found nowhere else.", "steps": ["Craft a tin or copper Prospector's Pan.", "Wade into shallow river water over sand, gravel, clay, mud or dirt and right-click it.", "Play the Swirl, Wash and Pick stages, and keep the River Silt each pan gives you.", "Craft and place a Sifting Board, then right-click it holding a load to sift.", "Shake, then brush or tweezer the board to lift your finds."], "commands": ["/prospect - your Prospector's Ledger of pans, gleams and finds"], "tips": ["Sneak and right-click to quick-pan or quick-sift (1 star, no gleam).", "Mountain, badlands, swamp, jungle, cold, cave and river-mouth rivers each pay differently.", "Rain refills river colour, and some chunks hold pay streaks.", "Fit a brass or silk mesh to your
