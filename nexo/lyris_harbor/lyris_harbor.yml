# Harbour Cargo decor set (Moonharbor). Decor furniture only, no plugin hooks.
harbor_crate:
  itemname: '<#e6d2a0>Shipping Crate'
  material: 'PAPER'
  lore:
  - '<gray><i>An iron-strapped crate stencilled with the harbour moon.</i>'
  - ''
  - '<#9ab4d6>Harbour decor'
